# ═══════════════════════════════════════════════════════════════════════
#  源影 · Flutter —— GitHub 构建
# ═══════════════════════════════════════════════════════════════════════
#
# # 三个 job 的分工
# ```text
# Windows   编 Rust 核心 → analyze → 全量测试 → 打包（约 12 分钟）
# macOS     编 Rust 核心 → analyze → 打包 .app + .dmg（约 15 分钟）
# Android   额外要 NDK + 交叉编译三个 ABI（约 30 分钟），**默认关闭**
# ```
# ★ Android 默认关掉的原因：它最慢，而 Windows 那个 job 已经覆盖了
#   Dart 与 Rust 两侧的全部测试。要跑就手动触发并勾上 build_android。
#
# # 发版本（Release）
# ```text
# 只在手动触发时可用：Actions → 构建 → Run workflow → 填 release_tag（如 v1.0.0）
#   · 留空  = 只构建，不发 Release
#   · 填了  = 构建完自动建 Release 并上传：Windows 安装包 + 免安装 zip、
#             macOS zip、Android 两个 APK、SHA256SUMS.txt
# 发 Android 的包要**同时**把 build_android 勾上（默认不勾）。
# ```
# ★ 三个平台 job 各自把成品压成 `rel-*` artifact，由末尾的 publish job 汇总。
#   之所以不让 publish 去下 `sourin-*` 那些 artifact：那条下载链路要走
#   Azure blob 的 SAS 重定向，实测只有几十 KB/s（125MB 要一小时）。
#
# # Android TV
# ```text
# Android TV **不需要单独的构建** —— 同一个 APK 就是手机版也是 TV 版：
#   AndroidManifest 里同时声明了 LAUNCHER 与 LEANBACK_LAUNCHER，
#   还声明了 uses-feature leanback / touchscreen(required=false)。
#   ⇒ 手机装上出现在桌面，电视装上出现在 TV 主界面，同一个文件。
# 运行时靠 `sourin/device` 平台通道读系统 feature 判定设备类型
# （MainActivity.kt 的 leanback / touchscreen），UI 自动切 TV 形态。
# 详见 docs/PLATFORMS.md 的「Android TV」一节。
# ```

name: 构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: 同时构建 Android（需要 NDK，较慢）
        type: boolean
        default: false
      # ★ 填了就发 Release（留空 = 只构建不发布）
      #   值必须是完整 tag，例如 v1.0.0。
      #   说明见文件末尾 publish job 上方那段。
      release_tag:
        description: '发布 Release 的 tag（留空=不发布），例如 v1.0.0'
        type: string
        default: ''

# ★ 同一分支的新 push 取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ★ 硬要求：Flutter 3.47 把 Material 拆成了独立的 material_ui 包，
  #   低于这个版本 pubspec 解析不过。详见 docs/BUILD.md「前置依赖」。
  FLUTTER_VERSION: "3.47.5"
  # ★ 注入到二进制的版本号（`String.fromEnvironment('SOURIN_VERSION')`）。
  #   非发版构建（push / PR）为空 ⇒ AppVersion 回退到 pubspec 的 1.0.0；
  #   发版构建时由三个平台的 job 各自从 inputs.release_tag 覆盖成真正的 tag。
  #   为什么必须注入：用户在「关于」里看到的版本必须是**这个包真实的版本**，
  #   否则更新检查会一直说"有新版"（它自己就是最新版）。
  SOURIN_VERSION: ""

jobs:
  # ═════════════════════════════════════════════════════════════════════
  #  Windows
  # ═════════════════════════════════════════════════════════════════════
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # ★ 发版时把全局的 SOURIN_VERSION 从空串覆盖成真正的 tag；
      #   非发版构建保持全局的空串 ⇒ App 读不到 dart-define，
      #   回退到 pubspec 的版本号（见 lib/core/app_update/app_version.dart）。
      SOURIN_VERSION: ${{ inputs.release_tag }}

    # ★ 外部弹幕服务的官方凭证（DANDANPLAY_APP_ID / APP_SECRET）**不在这里**声明：
    #   它只挂在下一条「构建 Windows 发布版」这一步的 env: 上。
    #   为什么不能放 job 级：job 级 env 会注入到**本 job 的每一个步骤**，
    #   于是「全量测试」与若干第三方 Action（checkout / flutter-action / …）
    #   都能读到 Secret。凭证只有构建那一步需要 ⇒ 就只给那一步
    #   （最小权限原则，对应 CWE-94 的注入面收窄）。


    steps:
      - name: 检出代码
        # ★★ 必须 `fetch-depth: 0`（完整历史）。checkout@v4 默认 `fetch-depth: 1`
        #   —— 只有 1 个提交，`HEAD~1` 根本不存在。
        #
        #   本 job 有三处门禁要靠「提交区间」：
        #     ① 决策笔记 archived 门禁  ← AGENT_NOTE_ARCHIVE_BASE_REF
        #     ② 笔记覆盖门禁            ← NOTES_COVERAGE_BASE
        #     ③ supersession 检查       ← NOTES_SUPERSESSION_BASE
        #
        #   而 `workflow_dispatch`（手动发版）事件里
        #   `github.event.pull_request.base.sha` 与 `github.event.before`
        #   **都不存在** ⇒ 那两个环境变量是空串 ⇒ 脚本回落到
        #   `--range HEAD~1..HEAD`，而这一句**同样需要 2 个提交**。
        #
        #   实测（2026-10-21，run 39540643339，Windows job）：
        #     fatal: ambiguous argument 'HEAD~1..HEAD': unknown revision
        #     这不是「已合规」—— 退出码 2
        #   ⇒ 手动发版走的正是这条路径，depth=1 时门禁必红。
        #
        #   ★ 那两处 step 的提示语写着「只检查 HEAD 这一个提交」，
        #     但它实际执行的是 `HEAD~1..HEAD`（两个提交）。
        #     这里按脚本的**真实行为**给足历史，不去改那句话的语义。
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── ⓪-0 凭据预检：凭证为空 ⇒ **响亮地红**，不是静默降级 ──────────
      #
      # ★ 实测背景（2026-10-21）：仓库 secrets 总数 = 0
      #   （`GET /repos/{o}/{r}/actions/secrets` → `total_count = 0`）
      #   ⇒ DANDANPLAY_APP_ID / DANDANPLAY_APP_SECRET 都没配。
      #
      #   而下面「构建 Windows 发布版」那一步是这么注入的：
      # ```yaml
      #   env:
      #     DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}     # ⇒ 空串
      #   --dart-define=DANDANPLAY_APP_ID="$env:DANDANPLAY_APP_ID"
      # ```
      #   **空串照样能编进二进制** ⇒ `String.fromEnvironment` 得到空串 ⇒
      #   App 回落到「用户自填凭证」，**不报错、不告警、构建成功、CI 全绿** ——
      #   只有业主装上之后才发现这个包没有官方弹幕。
      #   ⇒ 这正是本仓明令禁止的那一类：**缺件被当成正常**。
      #
      # ★ 判定放在 tools/check_required_secrets.sh 里（**本地与 CI 同一份**）：
      #   判的是**值**，不是名字 —— Actions 不提供「列出 secret 名」的能力
      #   （那要 PAT），`secrets` 上下文也不能出现在 `if:` 里。
      #   ⇒ 只能把值当环境变量注进来判空。这是唯一不需要额外凭据的落地方式。
      #
      # ★ 豁免：仓库变量 ALLOW_EMPTY_CREDENTIALS=true ⇒ 只打 ::warning:: 放行
      #   （**留痕**，不是静默）。⚠️ fork PR 拿不到 secrets ⇒ 本步会红；
      #   要放行就设那个变量，**不要**在这里加 `|| true`（那是假绿）。
      #
      # ★ 位置：紧跟检出、在装 Flutter / Rust **之前** —— 缺凭据 3 秒内就知道，
      #   不必等二三十分钟的构建白跑一遍再报。
      - name: 凭据预检（空值 ⇒ 响亮失败，不静默降级）
        # ★ 2026-10-21（Lead 复核后加）：**只对会产出用户可见安装包的构建**生效。
        #   理由：本仓现在 secrets 总数 = 0，若此步无条件跑，则每一个 PR / push
        #   的 Windows job 都会红 ⇒ 分支保护要求的 Windows 检查永远绿不了，
        #   于是「必须配凭据才能发版」变成了「必须配凭据才能合任何代码」——
        #   后者不是本步要防的风险（PR 产物没人装）。
        #   真正要防的是「装到用户机器上的包内嵌空凭据」，而那种包只在
        #   release_tag 非空时才会被打出来（见 :684 / :712 的 zip/NSIS 步）。
        #   ⇒ 判据挂在「会不会发布」上，不挂在「会不会编译」上。
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          # ★ 只在这一个步骤里注入，口径与下面真正打包那一步完全一致
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          # 仓库变量（不是 secret）：未设置时是空串 ⇒ 视为「未豁免」
          ALLOW_EMPTY_CREDENTIALS: ${{ vars.ALLOW_EMPTY_CREDENTIALS }}
        run: |
          set -euo pipefail
          bash tools/check_required_secrets.sh

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sourin_core

      # ── ①.5 决策笔记门禁 ───────────────────────────────────────────
      # ★ 只挂在 Windows job：三个平台跑的是同一棵笔记树，
      #   重复跑三次不会多验证任何东西，只会让 macOS / Android 的
      #   反馈时间变长（它们本来就要十几分钟）。
      #
      # ★★ 为什么要 `actions/setup-node` 而不是指望 runner 自带 node：
      #   runner 镜像里确实有 node（给 Actions 自己用），但那是**实现细节**，
      #   版本随镜像变。门禁依赖 tsx 跑 .ts，必须自己钉一个版本，
      #   否则某天镜像换 node 版本，门禁会以「跑不起来」的形式假绿/假红。
      - name: 装 Node（跑笔记校验脚本）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 决策笔记门禁（tree + format + archived）
        # ★★ 必须显式 `shell: bash`，**不能靠 Windows runner 的默认 shell**。
        #
        #   GitHub Actions 在 windows-latest 上的默认 shell 是 **pwsh**，
        #   而 pwsh 对原生命令的处置是：`$ErrorActionPreference='Stop'` 只管
        #   cmdlet 抛错，**不管外部程序的退出码**；runner 只在脚本**末尾**
        #   补一次 `exit $LASTEXITCODE`。
        #
        #   实测（2026-10-17，故意把 Status 改错）：
        #   ```text
        #   tree    → ok
        #   format  → 报 line 3 must match implemented status grammar
        #   archived→ ok
        #   ⇒ 整步退出码 **0**，门禁假绿。
        #   ```
        #   ⇒ 用 bash（runner 以 `bash -eo pipefail` 执行），第一条红即整步红。
        #
        # ★ 三线串跑，任一红即 job 红 —— 不做 `|| true` 之类的兜底。
        #
        # ★ `--yes` 是因为 CI 里没有交互式确认；tsx 只用于跑脚本，
        #   不进 package.json —— 本仓是 Flutter + Rust 双栈，
        #   为一个校验脚本引入 node_modules 与锁文件不划算。
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx .agents/notes-scripts/verify-agent-note-tree.ts
          npx --yes tsx .agents/notes-scripts/verify-agent-note-format.ts
          npx --yes tsx .agents/notes-scripts/verify-archived-agent-notes.ts
          # ★ 软报告，**故意不在此处跑**：`check-note-anchors.ts` 退出码恒 0，
          #   放进这条 `set -e` 链里只会让日志变长、不会让 job 变红。
          #   要体检时本地跑（见 docs/AGENTS.md §7.1 的「软报告」段）。
        env:
          # ★ 归档封印的 append-only 校验要一个**变更前**的基线：
          #   用 HEAD 等于没查（当前提交里的 manifest 自己跟自己比）。
          #   PR 用 base.sha，push 用 event.before。
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      # ── ①.6 笔记脚本与模板完整性 ─────────────────────────────────
      #
      # 三个 verify 脚本的口径必须与笔记树同版本 —— 本地绿、CI 红（或反过来）
      # 的根因几乎都是「脚本被单独手改了，其它副本没跟上」。
      # ⇒ 这里只做一件事：**证明脚本自身能被解析**（tsx 能编译 + 依赖文件齐全）。
      #   它不验证语义（那是上面三条的事），只挡「脚本坏了导致门禁假绿」。
      #
      # ★ 为什么值得单开一步：门禁脚本本身跑不起来时，
      #   `npx tsx` 会以非零退出 —— 但如果有人把调用改成 `|| true`，
      #   坏掉的脚本就永远不会被发现。这一步把「脚本可解析」变成独立信号。
      - name: 笔记脚本可解析性（防脚本自身坏掉导致门禁假绿）
        shell: bash
        run: |
          set -euo pipefail
          # ★ 判据必须是**会红**的：下面每条要么 test -f 失败、要么 tsx/node 非零退出。
          #   不写 `|| true`，不写「构造一个函数但不加载模块」那种恒绿探针
          #   （那证明不了脚本能被解析）。
          #
          # ① 七个 .ts 脚本 + 看板模板必须存在
          for f in \
            .agents/notes-scripts/agent-note-tree.ts \
            .agents/notes-scripts/verify-agent-note-tree.ts \
            .agents/notes-scripts/verify-agent-note-format.ts \
            .agents/notes-scripts/verify-archived-agent-notes.ts \
            .agents/notes-scripts/archive-agent-note.ts \
            .agents/notes-scripts/build-board.ts \
            .agents/notes-scripts/check-note-anchors.ts \
            .agents/assets/agent-notes-board.html \
          ; do
            test -f "$f" || { echo "::error::缺少笔记脚本或模板 $f"; exit 1; }
          done
          # ② .ts 必须能**真的被 tsx 跑起来**。
          #   判据实测过（2026-10-20）：往脚本末尾加一行语法错误 ⇒ tsx 退出 1；
          #   还原 ⇒ 退出 0。所以「能跑通」= 能解析，且不需要为 CI 引入 @types/node。
          #
          #   ★ 只跑**无副作用**的那个（check-note-anchors 是软报告，退出码恒 0，
          #     只读源码不写盘）。其余 .ts 的可解析性由**上面那步真实执行**覆盖：
          #     tree / format / archived 三个脚本在 ①.5 已经真跑过，
          #     能跑到 "ok: N note(s)" 就证明它们被解析并执行成功。
          npx --yes tsx .agents/notes-scripts/check-note-anchors.ts >/dev/null
          echo "ok: check-note-anchors.ts 可执行"
          #   build-board 不在 CI 里跑（看板是本地工具，产物不进仓库），
          #   它的可解析性靠下面 ③ 的「文件存在 + 模板存在」+ 本地实测覆盖。
          #   这里**不写 `|| true`** —— 缺文件会由 ① 的 test -f 直接红。
          # ③ 两个 .mjs 门禁：node --check 是真语法检查，非零即红。
          for f in .agents/notes-scripts/notes-coverage.mjs .agents/notes-scripts/notes-supersession.mjs; do
            node --check "$f"
            echo "ok: $f 语法正确"
          done

      # ── 发布说明守卫：用户可见正文不许再出现会腐烂的统计读数 ──
      - name: 装 Python（跑发布说明守卫）
        # ★★ 为什么必须自己装：这一步原先直接调 `python3`，
        #   而 GitHub 的 windows-latest runner **不保证有 python3**。
        #   实测（2026-10-21，run 39526450290）：这一步 exit 1，
        #   但脚本本身在本地（真 python 3.14）跑是 rc=0
        #   ⇒ 红的不是"命中了什么"，是**命令根本没跑起来**。
        #
        # ★ 同理：本机 `python3` 指向 Microsoft Store 的桩程序
        #   （`--version` 输出为空但 rc=0，静默不执行）——
        #   所以本地"跑过了"也证明不了 CI 能跑。
        #   ⇒ 本地与 CI 在这个命令上是两个环境，不能互相代替。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发布说明守卫（正文不许有统计口径）
        # ★★ 必须显式 `shell: bash`（理由同上：pwsh 的 $ErrorActionPreference
        #   管不到外部程序的退出码 ⇒ 门禁会假绿）。
        shell: bash
        run: |
          set -euo pipefail
          # ★ 用 `python` 而不是 `python3`：上面刚 setup-python@v5 钉过版本，
          #   它把 `python` 指到 3.12；而 `python3` 在 windows runner 上可能不存在
          #   （39526450290 就是这么红的）。
          python tools/guard_release_notes_numbers.py .github/release-notes.md

      # ── ⓪-a 坑表条数门禁：docs/PITFALLS.md 汇总表里的数 = 台账真实行数 ──
      #
      # ★ 为什么这条必须存在：汇总表里那三个数（A/B/C 组条数）是**手填的
      #   常量**，而台账每天都在加删条目（维护规则是「解决即删」）——
      #   数对了没有、漂了没有，**此前没有任何东西在看**。
      #   口径（「首格加粗」才算条目，因为 C 组块首还有一张症状速查表）
      #   已经写死在 tools/count_pitfalls.py 的文件头里，这里只负责调用，
      #   **不在这里复述口径**（口径写两处必然再次漂移）。
      #
      # ★ 退出码全部当红处理，一个都不吞：
      #     0 = 一致；1 = 数不一致；2 = 文件/表格/标记缺失。
      #   「查不到」不能当成「没问题」⇒ 2 也不放过（同 notes-coverage.mjs）。
      #   ★ 三种退出码都已故障注入实测（2026-10-21，ci-gate）：
      #       基线           → 0（`A=17 / B=18 / C=24（合计 59）` `✅ 一致`）
      #       汇总表 17→71    → 1（`::error::  A 组：文档写 71，实测 17`）
      #       删掉 B 组结束标记 → 2（`[count_pitfalls] 文档里找不到 B 组的…`）
      #     ⇒ 与 docstring 的 0/1/2 完全一致。★ 这里不再写「表里数字是多少」：
      #       数字会变，写死在这里就是**又一份会漂移的副本**（口径只归脚本）。
      #
      # ★ 复用上面「发布说明守卫」那步刚装好的 actions/setup-python@v5：
      #   用 `python` 而**不是** `python3` —— windows runner 上 python3 可能是
      #   Microsoft Store 的桩程序（`--version` 空输出但 rc=0，静默不执行）；
      #   同理必须显式 `shell: bash`（pwsh 的 $ErrorActionPreference 管不到
      #   外部程序的退出码 ⇒ 会假绿）。
      - name: 坑表条数门禁（docs/PITFALLS.md ⇄ tools/count_pitfalls.py）
        shell: bash
        run: |
          set -euo pipefail
          # ★ 先确认被调的两个文件都在：缺文件时 python 的报错是
          #   `can't open file`，那读起来像环境问题，而不像「没提交」。
          if [ ! -f tools/count_pitfalls.py ]; then
            echo "::error::tools/count_pitfalls.py 不存在 ⇒ 本次**什么都没核对**（不能算通过）"
            exit 1
          fi
          if [ ! -f docs/PITFALLS.md ]; then
            echo "::error::docs/PITFALLS.md 不存在 ⇒ 本次**什么都没核对**（不能算通过）"
            exit 1
          fi
          python tools/count_pitfalls.py --check

      # ── ⓪-b 笔记覆盖门禁：该写笔记的改动必须同批带笔记 ──────────────
      #
      # 上面那三条只验「**已经写了的**笔记格式对不对」，对「改了代码却一篇
      # 没写」完全无感。本仓最近 30 次提交只有 2 次带笔记，而其中 11 次
      # 真改了 lib/ 或 test/ 却没记 —— CI 一直是绿的，因为没人检查这件事。
      #
      # ★ 判定口径：**自动检测源码目录**（看目录里有没有 .dart/.rs/.go 等
      #   源码后缀），不写死任何路径。Flutter 的 lib/、Rust 的 rust/、
      #   测试的 test/ 都能认出来，换技术栈也不用改脚本。
      # ★ docs/ 故意豁免：那是计划与排查记录（过程），不是决策（结论）。
      #   本仓大多数提交是 `docs(round-66): 改计划文件`，那些本来就不该
      #   立决策笔记；把它们也纳入受管会让笔记树迅速注水。
      # ★ **逐提交**检查：一个提交带的笔记不能替另一个提交顶账 ——
      #   批量 push 正是最容易漏记的形态，合并看会被一个笔记全部掩护。
      # ★ 只查**本次 push 新增的提交**（用 event.before），历史欠账不追。
      # ★ 无法判定时退出码 2，且 2 算失败 —— 「查不到」不能当成「没问题」。
      - name: 笔记覆盖门禁
        shell: bash
        env:
          NOTES_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${NOTES_COVERAGE_BASE}" ] || \
             [ "${NOTES_COVERAGE_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可用的 base sha，改为只检查 HEAD 这一个提交。"
            node .agents/notes-scripts/notes-coverage.mjs --range HEAD~1..HEAD
          else
            node .agents/notes-scripts/notes-coverage.mjs --range "${NOTES_COVERAGE_BASE}..HEAD"
          fi

      # ── ⓪-c supersession 检查：新笔记必须声明与既有笔记的关系 ────────
      #
      # 规则借鉴 deepseek-ai/deepseek-harness 的 .agents/notes/AGENTS.md：
      #   Every new Agent Note triggers a supersession check.
      #
      # 本仓实测：38 篇笔记里 **36 篇没有任何互链**（95%）。不是作者懒 ——
      # 是没有任何东西提醒他去看既有笔记。笔记越多，重复的决定与已过期的
      # 结论就越多，而没有人会发现这一行。
      #
      # ★ 只查**新增**笔记（修改既有笔记本来就有归属）。
      # ★ 三种合法路径：相对链接 / `Independent: <理由>` / proposed·rejected 豁免。
      # ★ 不做语义判重：判断两篇是否讲同一决定需要理解内容，做不到可靠；
      #   硬做会产出大量误报，而误报的门禁一定会被绕过。
      - name: supersession 检查
        shell: bash
        env:
          NOTES_SUPERSESSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${NOTES_SUPERSESSION_BASE}" ] || \
             [ "${NOTES_SUPERSESSION_BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "没有可用的 base sha，改为只检查 HEAD 这一个提交。"
            node .agents/notes-scripts/notes-supersession.mjs --range HEAD~1..HEAD
          else
            node .agents/notes-scripts/notes-supersession.mjs --range "${NOTES_SUPERSESSION_BASE}..HEAD"
          fi

      # ── ⓪-c 能力位文档 ⇄ 代码接线（**软报告**，但扫描器坏了必须红）──────
      #
      # 2026-10-20：发现 `capability-bits.md` 说 `danmaku: false` 时
      # 「不显示弹幕入口」，但代码里它**只影响设置页一枚标签**。
      # 那是人读出来的。同类矛盾还有多少没人知道 ⇒ 机械化。
      #
      # ★ 退出码三档语义（脚本定义，本 job 按档处理）：
      #     0 = 跑完了（不管有没有孤儿）  ⇒ 绿
      #     1 = **扫描器自己坏了**        ⇒ **红**（本次什么都没查）
      #     2 = --strict 模式下有孤儿      ⇒ 警告
      #
      # ★★ 为什么不能用 `|| true`（原写法已删）
      #   `|| true` 会把「脚本崩了」也吞掉 —— 而「脚本崩了」与
      #   「孤儿位存在」是两件事：
      #     · 前者 ⇒ 本次**没有产出可信报告** ⇒ 必须红
      #     · 后者 ⇒ 可能是合法设计 ⇒ 只警告
      #   ⇒ `|| true` 让两者都变绿 ⇒ 扫描器坏掉时**静默**，
      #     而那正是这条报告要防的「静默降级」。
      #
      # ★ 为什么孤儿位是软报告而不是硬门禁：
      #   孤儿可能是**合法设计**（如 danmaku 只影响一枚标签）。
      #   做成硬门禁会逼人去"给每个位加个读取点"—— 那是**为门禁写代码**。
      - name: 能力位文档 ⇄ 代码接线（软报告）
        shell: bash
        run: |
          set -uo pipefail
          # 用 `-uo` 而不是 `-e`：脚本自身报错也要能看到输出，
          # 而不是被 set -e 直接中断掉（那样报告就没了）。
          #
          # ⚠️ 兄弟目录的私库文档在 CI 上不存在 ⇒ 脚本会自动只用本仓
          #    docs/PLUGINS.md，并在「覆盖度」里显式说明少查了哪些位。
          node tools/check-doc-capability-wiring.mjs
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::能力位扫描器自身失效（文档不存在 / 没扫到 dart / 没解析到能力位）—— 本次报告不可信"
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::warning::--strict 模式下发现孤儿能力位（软报告，不阻断）"
          fi
          echo ""
          echo "★ 孤儿能力位不判失败，但请人工确认它是设计还是缺陷。"
          exit 0

      # ── ① Rust 核心 ────────────────────────────────────────────────
      - name: 编 Rust 核心
        working-directory: rust/sourin_core
        run: cargo build --release

      - name: Rust 单元测试
        working-directory: rust/sourin_core
        run: cargo test --release --lib

      - name: 把核心放进 Windows 构建目录
        shell: pwsh
        run: |
          Copy-Item rust/sourin_core/target/release/sourin_core.dll windows/ -Force
          # ★ 核验：CMake 的拷贝按时间戳判断，这里显式确认产物真的在
          if (-not (Test-Path windows/sourin_core.dll)) {
            throw "sourin_core.dll 没有被拷进 windows/"
          }
          "核心大小 = " + (Get-Item windows/sourin_core.dll).Length

      # ── ② Dart 侧静态检查与测试 ────────────────────────────────────
      - name: 装依赖
        run: flutter pub get

      - name: 静态分析（0 error 才继续）
        # ★★ 这里有两个坑，都踩过：
        #
        # ① `flutter analyze` **默认把 warning / info 也算失败**（退出码 1）。
        #    本仓有约 440 条既有 warning/info（探针文件里的
        #    invalid_use_of_protected_member、测试里的 prefer_const_* 之类），
        #    ⇒ 不加下面两个 flag 的话 CI 永远红，门禁就失去意义了。
        #    `--no-fatal-infos --no-fatal-warnings` 之后：
        #      只有 error 才退出非零（实测：有 error 时仍返回 1 ✓）
        #
        # ② GitHub Actions 的 `shell: pwsh` 把
        #    `$ErrorActionPreference` 设成 **Stop**，而 PowerShell 会把
        #    原生命令写到 **stderr** 的任何一行包成 NativeCommandError ——
        #    `flutter analyze` 的进度提示就走 stderr ⇒ 会被当成终止性错误。
        #    ⇒ 不要自己 `$out = flutter analyze 2>&1` 再解析，直接让它跑，
        #      用退出码判断（`flutter` 是 cmd 包装，不会有这个问题）。
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: 全量测试
        run: flutter test --reporter expanded

      # ── ② 全量测试之后：断言「没有因缺件而静默 skip 的用例」──
      #
      # ★★★ 2026-10-19（批末复核查出的**真隐患**，Lead 修）
      #
      # # 问题
      # ```text
      # ① 本 job 的顺序是：pub get → **flutter test** → 构建 Windows 发布版
      #    （★ 按**步骤名**引用，不写行号 —— 行号会随任何一次插入而漂，
      #      本轮已经漂过一次。查位置请搜 `- name: 构建 Windows 发布版`）
      #    ⇒ 产出 libmpv-2.dll 的那一步在**测试之后**
      # ② 而 build.yml 自己 L896-898 写着（2026-10-12，CodeRabbit 指出、
      #    **已用 CI 实测证实**）：光 `flutter pub get` **供不出** libmpv-2.dll
      # ③ 没有 actions/cache 缓存 build/ ⇒ CI 上 libmpv **本来就不存在**
      # ⇒ 依赖 libmpv 的文件在 CI 上走 markTestSkipped ⇒ exit 0 ⇒ **CI 绿**
      #
      # # 为什么这不是「无害的 skip」
      # 55 个文件带 `native-media` 标签、默认 skip，裸 flutter test 本来就不选它们。
      # ★ 但有 **2 个文件不带标签** ⇒ 会进默认套件：
      #     test/zz_t66_player_jank_test.dart       8 条
      #     test/zz_t66_n11_bottombar_test.dart    7 条
      #   这 15 条在 CI 上全部静默 skip，而 job 绿。
      # ```
      #
      # # 为什么不用环境变量 SOURIN_REQUIRE_LIBMPV=1
      # ```text
      # ★ 它覆盖不到 —— 实测（复核逐个核过）：
      #   全仓有 **43 个**文件既真调 MediaKit.ensureInitialized 又带 native-media 标签
      #   另有 **7 个**文件提到 MediaKit 但**不带**标签（会进默认套件），
      #   其中 **6 个是真调用**、1 个（`zz_cr_local_row_trash_hover`）
      #   **只出现在注释里**：
      #     t27_w1_online_first ✱ / zz_cr_local_row_trash_hover ○仅注释 / zz_cr_local_select_ui ✱ /
      #     zz_media_r1_local_open_probe ✱ / zz_t12_defect_a_probe ✱ /
      #     zz_t66_n11_bottombar ✱ / zz_t66_player_jank ✱        （✱ = 真调用）
      #   而写了 `SOURIN_REQUIRE_LIBMPV` 的只有 **9 个文件**，
      #   且这 9 个**全部带 native-media 标签**（默认就不进套件）⇒
      #   ★★ 对**会进默认套件**的那 6 个真调用文件，只有 player_jank 有开关。
      # ★ 而且**单独设它会让主 job 每次必红**（libmpv 在全量测试时注定不在）
      #   ⇒ 团队很快会去关掉它 ⇒ 更糟。
      # ⇒ 改用**可执行断言**：直接读输出里的缺件字样，不依赖任何文件有没有写开关。
      #
      # ★ 前置：本 job 仍未供出 libmpv ⇒ 这条断言**现在会红**。
      #   这是**故意**的 —— 它把一个「静默失效」变成「显式失败」，
      #   逼着要么让本 job 真的 build 出 libmpv，要么明确接受这 15 条不跑。
      #   （那需要 Owner 拍板：本 job 是拦合并的主 job，为 15 条测试
      #     加一次完整 windows 构建是否值得。）
      # ★★★ 2026-10-19（批末复核查出的**真隐患**，Lead 修）
      #   本步骤**已挪到 `核验产物` 之后** —— 位置是这个改动的关键，见那里的注释。

      # ── ③ 打包 ─────────────────────────────────────────────────────
      - name: 构建 Windows 发布版
        # ★ 凭证 env 只挂在这一步（最小权限，理由见上面 job 里的说明）。
        # ★ 用 $env:NAME 而非 ${{ env.NAME }} 展开：Windows 这一步是 pwsh，
        #   环境变量语法是 $env:NAME。这样 Secret 的内容作为**环境变量值**
        #   被 dart 的 --dart-define 直接取用（命令行是参数数组，不经 shell
        #   二次解析）⇒ Secret 里若含双引号 / $ / 反引号也不会改变命令解析
        #   （对应 CWE-94：把不可信输入从命令文本里挪出解析面）。
        # ★ -t 不能漏：入口是 shell.dart。lib/main.dart 是早期的 HEVC
        #   验收 spike（见那个文件头），编错了不会报错，只是行为完全不同。
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        # ★ --dart-define=SOURIN_VERSION 让 App 知道自己是谁（发版时为 tag）
        # fork PR 拿不到 secrets ⇒ 两个 env 为空串 ⇒ dart-define 也是空串 ⇒
        # String.fromEnvironment 缺省空串，App 回落到用户自填凭证，行为不变。
        run: >-
          flutter build windows --release --no-pub -t lib/shell.dart
          --dart-define=SOURIN_VERSION=${{ env.SOURIN_VERSION }}
          --dart-define=DANDANPLAY_APP_ID="$env:DANDANPLAY_APP_ID"
          --dart-define=DANDANPLAY_APP_SECRET="$env:DANDANPLAY_APP_SECRET"

      - name: 核验产物
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          $exe = Join-Path $rel "sourin_spike.exe"
          $dll = Join-Path $rel "sourin_core.dll"
          if (-not (Test-Path $exe)) { throw "缺少 $exe" }
          if (-not (Test-Path $dll)) { throw "缺少 $dll" }
          # ★ app.so 的大小是「编的确实是产品入口」的判据：
          #   shell 入口约 10.7 MB；spike 入口只有约 1 MB。
          $app = Join-Path $rel "data/app.so"
          $n = (Get-Item $app).Length
          "app.so = $n 字节"
          if ($n -lt 5000000) {
            throw "app.so 只有 $n 字节 —— 很可能漏了 -t lib/shell.dart，编出来的是 spike"
          }
          # ★ 播放内核 libmpv-2.dll 必须随产物一起发出去：缺了它业主双击
          #   sourin_spike.exe 能开窗，但任何视频都放不出来（播放器建不起来）。
          #   ★ 它不是手工放置的 —— 由 pub 依赖 media_kit_libs_windows_video
          #     的 CMake 自动供给（下载并解包 mpv-dev 的 7z，再经
          #     windows/flutter/generated_plugins.cmake 的
          #     PLUGIN_BUNDLED_LIBRARIES 机制装进 runner/Release）。
          #     所以这一条查的是「自动供给这条链有没有做成功」，
          #     而不是「有没有人手动拷进来」。
          $mpv = Join-Path $rel "libmpv-2.dll"
          if (-not (Test-Path $mpv)) {
            throw "缺少 $mpv —— 播放内核（libmpv）没被 media_kit_libs_windows_video 装进产物，业主的包里将放不出任何视频"
          }
          $n = (Get-Item $mpv).Length
          "libmpv-2.dll = $n 字节"

      # ── ② 断言：默认套件里没有因缺件而静默 skip 的用例 ──
      #
      # ★★★ 2026-10-19（批末复核查出的**真隐患**，Lead 修；同日修正位置）
      #
      # # 问题
      # ```text
      # 本 job 的顺序是 pub get → **flutter test** → **构建 Windows 发布版**
      # 而构建是**全文唯一**供出 libmpv-2.dll 的步骤
      # ⇒ 全量测试跑的时候 libmpv **不存在**
      # ⇒ 依赖 libmpv 的文件走 markTestSkipped ⇒ exit 0 ⇒ **job 绿**
      #
      # 55 个文件带 `native-media` 标签、默认 skip，裸 flutter test 本来就不选。
      # ★ 但有 **2 个不带标签** ⇒ 会进默认套件：
      #     test/zz_t66_player_jank_test.dart     8 条
      #     test/zz_t66_n11_bottombar_test.dart  7 条
      #   这 15 条在 CI 上从未跑过，而 job 绿。
      # ```
      #
      # ★★★ 位置是这个改动的**关键**（我第一版放错了，代价见下）
      # ```text
      # 第一版我把它排在「全量测试之后、构建之前」⇒
      #   它跑的时候 libmpv 尚未被构建出来 ⇒ **100% FIRED**；
      #   而 FIRED 会让构建步骤不执行 ⇒ libmpv 永远供不出来
      #   ⇒ **它自己制造了它要检测的那个缺失**，形成自我封闭的循环。
      # 而 `Windows` 是**必需检查**（对管理员也生效）⇒ 那个位置会让仓库冻结。
      #
      # ⇒ 现在放在「核验产物」之后：那里 `Test-Path $mpv` 已经 throw 过，
      #   libmpv 必定存在 ⇒ 断言成了**真门禁**，而且那 15 条**真的跑了**。
      #   代价只是重跑两个文件（它们在上面的全量测试里已跑过一遍，当时是 skip）。
      # ```
      #
      # ★ 为什么不用 `SOURIN_REQUIRE_LIBMPV=1`：它覆盖不到 ——
      #   实测写了那个开关的有 9 个文件，而**全部带 native-media 标签**
      #   （默认就不进套件）；会进默认套件的那 7 个里只有 player_jank 有。
      #   且单独设它会让 job 每次必红 ⇒ 团队很快会去关掉它。
      #
      # ★ 位置为什么在这里（本 job 内「核验产物」验证的就是 libmpv）：
      #   测试的 `_libmpvCandidates()` 在 Windows 上有两个候选：
      #     build/windows/x64/libmpv/libmpv-2.dll            ← CMake 落点
      #     build/windows/x64/runner/Release/libmpv-2.dll   ← 装进产物那份
      #   而上面的「核验产物」查的是 `runner/Release/libmpv-2.dll`
      #   （`:355` 的 `$mpv`）—— 它已 throw 过 ⇒ **第二个候选必定存在**
      #   ⇒ 守卫跑的时候两个候选都在，不会误报。
      #   实测：两个候选当前大小完全相同（29,764,622 字节），是同一份的两个副本。
      - name: 断言：默认套件里那 15 条真的跑完了
        shell: bash
        run: |
          # ★★ 2026-10-19（复核发现我的第一版判据有盲区，Lead 改）：
          #   第一版只 `grep '夹具缺失'` ⇒ 它只检测「缺件」这一种失效。
          #   复核实测抓到盲区：**libmpv 偶发 native 崩溃**时，
          #   7 条变成 `did not complete`，输出里**没有**「夹具缺失」字样
          #   ⇒ 守卫放行，而实际上「这 15 条一条都没跑完」。
          # ⇒ 现在用两条互补判据，且**第二条才是根本**。
          out=$(flutter test test/zz_t66_player_jank_test.dart \
                                test/zz_t66_n11_bottombar_test.dart \
                                --reporter=expanded 2>&1)
          echo "$out"

          # ── 判据①：明确缺件 ──
          #   这两个文件在 libmpv 就位时会正常打印
          #   `[LIBMPV] 夹具 = <路径>`（zz_t66_player_jank_test.dart:216），
          #   那是**成功**的证据；只有 `:221` 打印的
          #   `[LIBMPV] 夹具缺失 ⇒ …` 才是缺件。
          if echo "$out" | grep -q '夹具缺失'; then
            echo "::error::libmpv 缺失 ⇒ 这 15 条门禁是**静默 skip**，不是通过。"
            exit 1
          fi

          # ── 判据②：★★ 真的跑完了吗（这才是根本判据）──
          #   `All tests passed` 是**唯一**能证明「全部跑完且通过」的字符串。
          #   `did not complete`（native 崩溃）**不含**「夹具缺失」，
          #   只靠判据①会漏掉它 ⇒ 这就是第一版的盲区。
          if ! echo "$out" | grep -q 'All tests passed'; then
            echo "::error::这 15 条门禁**没有跑完** —— 不是「缺件」，"
            echo "::error::是 libmpv 偶发 native 崩溃（dart_test.yaml 顶部有记录）。"
            echo "::error::**没有** 'All tests passed' ⇒ 不能当作通过。"
            exit 1
          fi
        continue-on-error: true

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: sourin-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14

      # ── 发 Release 用的 zip（只在填了 release_tag 时才跑）────────────
      #   ★ 为什么在这里压而不是让 publish job 去下 artifact：
      #     artifact 的下载要走 Azure blob 的 SAS 重定向，那条链路在某些
      #     网络环境下只有几十 KB/s（实测 40MB 要十几分钟、125MB 要一小时）。
      #     在 runner 上就地压缩再上传，是**runner 直连 GitHub**，快得多。
      - name: 打包 Release 用的 zip
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          $zip = "build/sourin-windows-${{ inputs.release_tag }}.zip"
          # ★ 先删后建，避免 zip 里混进上一次的残留
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -CompressionLevel Optimal
          $i = Get-Item $zip
          "zip = $($i.Length) 字节"
          # ★ 自检：解压后的顶层必须是 sourin_spike.exe 等文件本身，
          #   而不是一个 Release\ 目录（Compress-Archive 的 -Path 通配会决定这个）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($i.FullName)
          try {
            $names = $z.Entries | ForEach-Object { $_.FullName }
            $hasExe = $names -contains "sourin_spike.exe"
            "zip 条目数 = $($names.Count)  顶层有 sourin_spike.exe = $hasExe"
            if (-not $hasExe) { throw "zip 结构不对：顶层没有 sourin_spike.exe" }
          } finally { $z.Dispose() }

      # ── 可安装版：NSIS 安装包（只在填了 release_tag 时才跑）──────────
      #   ★ 为什么必须有：zip 是**免安装版**（解压即用），但很多用户要的是
      #     「双击 → 下一步 → 装好、开始菜单和桌面都有图标、能在「应用和功能」
      #     里卸载」的那种。两者都要发。
      #   ★ 安装包的 payload **就是刚构建出来的 Release 目录** —— 与 zip
      #     同源同 commit，不存在「安装包里的 exe 比 zip 里的旧」这种可能。
      - name: 装 NSIS
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: |
          # ══════════════════════════════════════════════════════════════
          # ★★★ 装 NSIS —— **必须能扛住 choco 社区源的瞬时故障**
          # ══════════════════════════════════════════════════════════════
          #
          #  # 为什么加了重试 + 独立回退源（run 38384556818 的真实事故）
          #
          #  实测（v1.1.0 那次发布）：`choco install nsis` 单发一次，
          #  社区源回了一个 **504 Gateway Timeout**：
          # ```text
          #   Failed to fetch results from V2 feed at
          #     'https://community.chocolatey.org/api/v2/Packages(Id='nsis',Version='3.13.0')'
          #     Response status code does not indicate success: 504 (Gateway Timeout).
          #   Unable to find package 'nsis'.
          #   Chocolatey installed 0/0 packages.
          #   ⇒ 本步 throw ⇒ Windows job 红
          #   ⇒ rel-windows-* 这个 artifact 根本没上传
          #   ⇒ 发 Release job 只把「成功的平台」拼进去 ⇒
          #      **v1.1.0 的 Release 少了 Windows 免安装 zip 与 NSIS 安装包**，
          #      而用户看到的下载页就是缺了整整一个平台。
          # ```
          #  504 是**外部基础设施的瞬时故障**，与我们改的代码毫无关系 ——
          #  绝不能因为它把整个 Windows 交付件从 Release 里抹掉。
          #
          #  # 两层防御
          #  ① 重试：choco 单次失败多数是瞬时 5xx，退避重试 3 次能挡掉绝大多数。
          #  ② 独立回退源：若重试仍失败，直接从 **SourceForge 的官方 NSIS zip**
          #     下载解包。它与 choco 的 CDN **不是同一条链路** ——
          #     choco 挂了它往往还是通的（这正是本仓「不要单点依赖」的一贯口径）。
          #
          #  # ★ 为什么不能只打 warning 就继续
          #  本仓铁律（CONTRIBUTING.md ⑥ 规矩二）：门禁不许「只警告不失败」。
          #  装不上 NSIS 就**编不出安装包**，而安装包是交付件之一 ⇒ 必须真失败，
          #  不能降级成 warning 然后发出一个缺件的 Release。
          $ErrorActionPreference = 'Continue'
          $installed = $false
          for ($i = 1; $i -le 3; $i++) {
            "---- choco install nsis（第 $i/3 次）----"
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            "choco 第 $i 次失败（exit=$LASTEXITCODE），10 秒后重试"
            Start-Sleep -Seconds 10
          }
          if (-not $installed) {
            "choco 三次都没装上 —— 改用 SourceForge 官方 NSIS zip 回退"
            # ★ NSIS 官方发布在 SourceForge；3.10 是稳定版。
            #   curl.exe（不是 Invoke-WebRequest）跟随 302 重定向更可靠，
            #   且 GitHub runner 自带。 -L 跟随跳转、-f 遇到 4xx/5xx 直接失败。
            # ★★ `--proto-redir =https`（CodeRabbit 指出，已采纳）：
            #   SourceForge 是 302 跳到镜像站的，`-L` 默认**允许**中途降级到
            #   http:// —— 那样下载内容可被中间人替换，而我们会解压并**执行**
            #   其中的 makensis.exe。限制重定向只许 https（=https 是「只允许
            #   https」的写法，注意等号与值之间不能有空格）。
            # ★★ 下载后必须校验 **固定 SHA-256**（CWE-494：无完整性校验地
            #   下载并执行代码）。这个摘要是本地实测得到、两次独立下载一致：
            #     nsis-3.10.zip
            #     sha256 = fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110
            #     大小   = 2358406 字节
            #   摘要对不上就 throw —— 绝不执行来路不明的 makensis.exe。
            #   升级 NSIS 版本时**必须**同步更新下面两个常量。
            $zip = "$env:RUNNER_TEMP\nsis.zip"
            $dst = "$env:RUNNER_TEMP\nsis"
            $wantSha = 'FCDCE3229717A2A148E7CDA0AB5BDB667F39D8FB33EDE1DA8DABC336BD5AD110'
            curl.exe -L -f --proto-redir =https --retry 3 --retry-delay 5 -o $zip `
              'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip'
            if (-not (Test-Path $zip)) {
              throw '回退也失败：没下到 NSIS zip（choco 与 SourceForge 都不通）'
            }
            $gotSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            "NSIS zip = $((Get-Item $zip).Length) 字节，sha256 = $gotSha"
            if ($gotSha -ne $wantSha) {
              throw "NSIS zip 的 sha256 不匹配（期望 $wantSha，实得 $gotSha）—— 拒绝执行来路不明的 makensis.exe"
            }
            Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          }
          # ★★ 不要靠 PATH 找 makensis。
          #   实测（run 37788073987）：choco 明明报「Deployed to
          #   C:\Program Files (x86)\NSIS」，但刷新 Machine+User PATH 之后
          #   `Get-Command makensis` **仍然找不到** —— nsis 包只解压文件，
          #   **不往 PATH 里加目录**（不像某些包会调 Install-ChocolateyPath）。
          #   ⇒ 直接按已知安装位置找，PATH 只作为兜底。
          # ⚠️ PowerShell **不允许数组字面量的尾逗号**（C/JS/Python 都允许，PS 不行）：
          #    `$c = @('a','b',)` ⇒ ParserError: Missing expression after ','.
          #    实测踩过：run 37794997959 的「装 NSIS」就是被这个尾逗号整步挂掉的。
          $candidates = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe',
            'C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe'
          )
          $mk = $null
          foreach ($c in $candidates) {
            if (Test-Path -LiteralPath $c) { $mk = $c; break }
          }
          if (-not $mk) {
            # 兜底：刷新 PATH 再找一次（万一将来 choco 包改了行为）
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                        [System.Environment]::GetEnvironmentVariable('Path','User')
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $mk = $cmd.Source }
          }
          if (-not $mk) {
            # 兜底：在回退解包目录里找（SourceForge zip 的顶层是 nsis-3.x\）
            $found = Get-ChildItem "$env:RUNNER_TEMP\nsis" -Filter 'makensis.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $mk = $found.FullName }
          }
          if (-not $mk) {
            # 最后兜底：整盘搜（慢，但比「莫名其妙装不上」好查）
            $found = Get-ChildItem 'C:\' -Filter 'makensis.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $mk = $found.FullName }
          }
          if (-not $mk) { throw '装完 NSIS 还是找不到 makensis（choco 与回退源都试过了）' }
          "makensis = $mk"
          & $mk /VERSION
          # ★ 把路径交给后面那一步（同一次 job 内跨 step 传值）
          "MAKENSIS=$mk" >> $env:GITHUB_ENV

      - name: 编译安装包
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          $rel = 'build/windows/x64/runner/Release'
          $pay = 'installer/payload'
          # ★ 每次重建 payload，避免混进上一次的残留
          if (Test-Path $pay) { Remove-Item $pay -Recurse -Force }
          New-Item -ItemType Directory -Path $pay -Force | Out-Null
          # 顶层：exe + dll + json（与交付 zip 的顶层完全一致）
          Get-ChildItem -LiteralPath $rel -File |
            Where-Object { $_.Extension -in @('.exe','.dll','.json') } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $pay -Force }
          Copy-Item -LiteralPath (Join-Path $rel 'data') -Destination (Join-Path $pay 'data') -Recurse -Force
          $n = (Get-ChildItem $pay -Recurse -File | Measure-Object).Count
          "payload 文件数 = $n"
          # ★ 自检：安装包不能漏掉核心库与入口 exe（漏了就是装完打不开）
          foreach ($must in @('sourin_spike.exe','sourin_core.dll','libmpv-2.dll','data/app.so')) {
            if (-not (Test-Path (Join-Path $pay $must))) { throw "payload 缺少 $must" }
          }
          # ★ 版本号从 tag 注入（tag 形如 v1.0.0 ⇒ 1.0.0）
          $ver = $tag -replace '^v',''
          # ★★ 产物**必须落在 build/ 下**，不能留在 installer/ ——
          #   `upload-artifact` 会剥掉所有上传路径的**共同祖先**：
          #     macOS 传 build/x.zip + build/x.dmg  ⇒ 祖先 build/  ⇒ 包里是 x.zip / x.dmg（对）
          #     改前的 Windows 传 build/x.zip + installer/s.exe ⇒ 祖先是仓库根 ⇒
          #       包里变成 build/x.zip 与 installer/s.exe 两个**子目录**
          #   ⇒ publish job 在 rel/ 根下找不到它们，静默只发了 macOS+Android。
          #   实测：run 37802958581 的 rel/ 里是 `rel/build/...zip` 与 `rel/installer/...exe`。
          $outfile = "Sourin-Setup-$ver.exe"
          "版本 = $ver，产物名 = $outfile"
          Set-Location installer
          # ★ 用上一步交下来的绝对路径（不靠 PATH，理由见上一步的注释）
          & $env:MAKENSIS /V2 "/DAPP_VERSION=$ver" "/DOUTFILE=../build/$outfile" sourin.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis 失败（exit $LASTEXITCODE）" }
          Set-Location ..
          $exe = "build/$outfile"
          $i = Get-Item $exe
          "安装包 = $($i.Length) 字节"
          # ★ 自检：安装包体积必须 > 20MB（payload 约 130MB，压缩后约 28MB）。
          #   若 payload 没被收进去，makensis 会产出一个小得多的包 ——
          #   那种包装完是空的，而 makensis 自己**不会报错**。
          if ($i.Length -lt 20000000) { throw "安装包只有 $($i.Length) 字节，payload 很可能没进去" }
          # ★ 再确认包**里**真的含关键文件（7z 能直接列 NSIS 的内容）
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path $sevenZip) {
            $list = & $sevenZip l $exe 2>&1 | Out-String
            foreach ($must in @('sourin_spike.exe','sourin_core.dll','app.so')) {
              if ($list -notmatch [regex]::Escape($must)) { throw "安装包里没有 $must" }
            }
            '✓ 7z 确认包内含 sourin_spike.exe / sourin_core.dll / app.so'
          } else { '（runner 上没装 7-Zip，跳过包内容核验）' }

      - name: 上传 Release zip + 安装包（Windows）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: rel-windows-${{ inputs.release_tag }}
          # ★ 两个文件必须在**同一个父目录**下，否则 artifact 里会多出子目录
          #   （upload-artifact 剥的是共同祖先）。理由逐字见上面编译那一步的注释。
          path: |
            build/sourin-windows-${{ inputs.release_tag }}.zip
            build/Sourin-Setup-*.exe
          retention-days: 1

  # ═════════════════════════════════════════════════════════════════════
  #  macOS
  # ═════════════════════════════════════════════════════════════════════
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # ★ 发版时把全局的 SOURIN_VERSION 从空串覆盖成真正的 tag；
      #   非发版构建保持全局的空串 ⇒ App 读不到 dart-define，
      #   回退到 pubspec 的版本号（见 lib/core/app_update/app_version.dart）。
      SOURIN_VERSION: ${{ inputs.release_tag }}

      # ★ 外部弹幕服务的官方凭证（DANDANPLAY_APP_ID / APP_SECRET）**不在这里**声明：
      #   它只挂在下一条「构建 macOS 发布版」这一步的 env: 上。
      #   为什么不能放 job 级：job 级 env 会注入到**本 job 的每一个步骤**，
      #   于是「全量测试」与若干第三方 Action（checkout / flutter-action / …）
      #   都能读到 Secret。凭证只有构建那一步需要 ⇒ 就只给那一步
      #   （最小权限原则，对应 CWE-94 的注入面收窄）。

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 凭据预检（与 Windows job 同款，逐字理由见那里 :150 附近）──────
      #
      # ★ 为什么 macOS 也必须有：凭证是**两个平台各自** --dart-define 编进二进制
      #   的（Windows 见 :549，macOS 见 :961）。只查 Windows ⇒ macOS 的 DMG
      #   仍然可能带着空凭据发出去，而业主看不出两个平台的区别。
      # ★ 判定脚本与本地跑的是**同一份** tools/check_required_secrets.sh。
      - name: 凭据预检（空值 ⇒ 响亮失败，不静默降级）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          ALLOW_EMPTY_CREDENTIALS: ${{ vars.ALLOW_EMPTY_CREDENTIALS }}
        run: |
          set -euo pipefail
          bash tools/check_required_secrets.sh

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sourin_core

      - name: 编 Rust 核心
        working-directory: rust/sourin_core
        run: cargo build --release

      - name: 装依赖
        run: flutter pub get

      - name: 静态分析（0 error 才继续）
        # 与 Windows 那个 job 同款（理由逐字见那里的注释）：
        # `flutter analyze` 默认把 warning/info 也算失败，本仓有约 440 条
        # 既有 warning/info ⇒ 必须显式降级，只让 error 卡住 CI。
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: 全量测试
        run: flutter test

      - name: 构建 macOS 发布版
        # ★ 凭证 env 只挂在这一步（最小权限，理由见上面 job 里的说明）。
        # ★ 用 $NAME 展开（macOS 这一步是 bash）：Secret 内容作为环境变量值
        #   被 --dart-define 直接取用（命令行是参数数组，不经 shell 二次解析），
        #   Secret 里含双引号 / $ / 反引号也不会改变命令解析（CWE-94）。
        # ★ --dart-define=SOURIN_VERSION 让 App 知道自己是谁（发版时为 tag）
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: >-
          flutter build macos --release --no-pub -t lib/shell.dart
          --dart-define=SOURIN_VERSION=${{ env.SOURIN_VERSION }}
          --dart-define=DANDANPLAY_APP_ID="$DANDANPLAY_APP_ID"
          --dart-define=DANDANPLAY_APP_SECRET="$DANDANPLAY_APP_SECRET"

      - name: 核验产物
        shell: bash
        run: |
          set -euo pipefail
          # ★ 产物名来自 macos/Runner/Configs/AppInfo.xcconfig 的 PRODUCT_NAME=sourin_spike。
          #   ⚠️ 这里**不能**写「源影.app」：用户看到的窗口标题由 lib/shell.dart 的
          #   WindowOptions(title: '源影') 决定，与 .app 的文件名无关；而 pbxproj 里有
          #   3 处硬引用 sourin_spike.app，改中文会让产物名与引用名对不上。
          APP="build/macos/Build/Products/Release/sourin_spike.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 $APP"
            echo "  名字来源：macos/Runner/Configs/AppInfo.xcconfig 的 PRODUCT_NAME=sourin_spike"
            echo "  真实产物：$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null || echo '(构建目录为空)')"
            exit 1
          fi
          # ★ 权限声明必须真的进了产物 —— 少了 network.client 的话
          #   应用能启动但所有请求都失败（最难查的那类）。
          codesign -d --entitlements - "$APP" 2>&1 | tee /tmp/ent.txt
          for k in network.client network.server; do
            if ! grep -q "$k" /tmp/ent.txt; then
              echo "::error::$APP 缺少 $k 权限 —— 播放会失败"; exit 1
            fi
          done
          # ★★ Rust 核心必须真的在包里 —— 少了它 macOS 版能启动但**所有功能都挂**
          #   （只能看到详情页的 _ErrorView）。
          #
          #   背景（2026-10-08 实测确证）：`macos/` 整棵树对 `sourin_core` **零引用**，
          #   pbxproj 里只有 Flutter 自带的两个 ShellScript 阶段 ⇒ 产物里确实没有这个 dylib。
          #   而 `lib/core/ffi.dart:173-174` 是 `DynamicLibrary.open('libsourin_core.dylib')`
          #   ⇒ 一调核心就抛。对照 Windows 侧有机制（`windows/CMakeLists.txt:122-133` 的
          #   `install(FILES ...)`），macOS 侧原本没有。
          #   ⚠️ 早期 README 里「由 macos/ 的 Xcode 工程自动带上」那句是**错的** —— 那个「自动」当时
          #      并不存在（该阶段是 2026-10-08 后加的）。现状见 docs/PLATFORMS.md「构建 macOS」。
          #
          #   ★ 为什么必须是**硬门禁**而不是 warning：这个缺陷**已经在 CI 里绿着通过了**。
          #     只警告 = 假门禁，比红更糟（红会被看见，警告会被忽略）——
          #     与 android job 里那条 `grep LEANBACK_LAUNCHER` 永远为假是同一类病。
          CORE="$APP/Contents/Frameworks/libsourin_core.dylib"
          if [ ! -f "$CORE" ]; then
            echo "::error::$APP 里没有 Rust 核心 $CORE"
            echo "  期望来源：rust/sourin_core/target/release/libsourin_core.dylib"
            echo "  嵌入方式：pbxproj 的 Run Script 阶段（Embed Rust Core）"
            echo "  Frameworks 实际内容：$(ls -1 "$APP/Contents/Frameworks" 2>/dev/null || echo '(无 Frameworks 目录)')"
            echo "  Resources 实际内容：$(ls -1 "$APP/Contents/Resources" 2>/dev/null || echo '(无 Resources 目录)')"
            exit 1
          fi
          # ★ 再核验导出符号数：编了个旧的/空的 dylib 同样会让功能全挂。
          #   （`nm -gU` 列出外部符号；Rust 侧导出 7 个 `sourin_*`，见 docs/ARCHITECTURE.md「FFI 契约」。）
          n=$(nm -gU "$CORE" 2>/dev/null | grep -c '_sourin_' || true)
          echo "Rust 核心导出符号数：$n"
          if [ "$n" -lt 7 ]; then
            echo "::error::Rust 核心只有 $n 个 sourin_ 符号（应 >= 7）—— 编了个旧的/空的？"
            exit 1
          fi
          echo "产物大小："; du -sh "$APP"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: sourin-macos-${{ github.sha }}
          # ★ 只传 .app —— 它是自包含的（dylib 都在 Frameworks/ 里），
          #   解压即用。做 .dmg 需要额外装 create-dmg，收益不大。
          path: build/macos/Build/Products/Release/*.app
          retention-days: 14

      # ── 发 Release 用的 zip（只在填了 release_tag 时才跑）────────────
      #   ★★ 必须用 ditto -c -k --sequesterRsrc --keepParent，**不能**用 zip：
      #     .app 是**目录**，里面有可执行位与符号链接（Frameworks/ 里那些
      #     Versions/A 链接）。zip 会把符号链接**展开成实体文件**、
      #     并且**丢掉可执行位** ⇒ 用户解压后双击无反应
      #     （Gatekeeper 之后还会再拦一层，变成「打不开且不知道原因」）。
      #     ditto 是 Apple 官方用于分发 .app 的工具，保留全部元数据。
      - name: 打包 Release 用的 zip
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          APP="build/macos/Build/Products/Release/sourin_spike.app"
          ZIP="build/sourin-macos-${{ inputs.release_tag }}.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ls -l "$ZIP"
          # ★ 自检：zip 顶层必须恰好是一个 sourin_spike.app 目录
          #   （--keepParent 的作用；少了它解压出来是一堆散文件）
          if ! unzip -l "$ZIP" | grep -q "sourin_spike.app/Contents/MacOS/sourin_spike"; then
            echo "::error::zip 结构不对：找不到 sourin_spike.app/Contents/MacOS/sourin_spike"; exit 1
          fi
          # ★ 再确认核心库在里面（与「核验产物」同一条判据，防 zip 这一步漏掉）
          if ! unzip -l "$ZIP" | grep -q "Contents/Frameworks/libsourin_core.dylib"; then
            echo "::error::zip 里没有 libsourin_core.dylib —— macOS 版核心功能会全挂"; exit 1
          fi
          echo "✓ zip 结构核验通过"

      # ── 发 Release 用的 DMG（只在填了 release_tag 时才跑）──────────
      #
      #  # 为什么要有 DMG（用户原话：「mac也要dmg的,而不是压缩包的」）
      #
      #  zip 对 macOS 用户是**外来形态**：正常 macOS 软件的分发方式是
      #  「打开 .dmg → 把图标拖进 Applications」。zip 解压出来是个
      #  孤零零的 .app，用户不知道该放哪、也看不到「拖进去」这个动作。
      #
      #  # 为什么不用第三方 action（create-dmg 之类）
      #
      #  `hdiutil` 是 macOS 自带工具，全程可控；引第三方 action 只是把
      #  同一件事包一层，出问题时更难查。下面每一步都有自检。
      #
      #  # 为什么先建一个暂存目录再打包
      #
      #  DMG 里要放三样东西：.app 本体、Applications 的软链（拖拽目标）、
      #  一段说明。直接对 build 目录打会把整个 Release 目录塞进去。
      - name: 打包 Release 用的 DMG
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/sourin_spike.app"
          DMG="build/sourin-macos-${{ inputs.release_tag }}.dmg"
          STAGE="build/dmg-stage"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          # ★ ditto 而不是 cp -R：保留符号链接与可执行位（.app 里两者都有）
          ditto "$APP" "$STAGE/sourin_spike.app"
          # ★ Applications 软链 —— 这是「拖进去」那个动作的目标。
          #   用相对路径 ../Applications，这样挂载点随便叫什么都能解析。
          ln -s /Applications "$STAGE/Applications"
          # ★ 放一份说明在 DMG 里（用户打开 dmg 第一眼能看到）
          cat > "$STAGE/安装说明.txt" <<'EOF'
          源影 (Sourin) —— macOS 安装说明
          ================================
          
          1. 把 sourin_spike.app 拖到右边的 Applications 文件夹上
          2. 从「应用程序」里打开它
          3. 首次打开会被 Gatekeeper 拦下（本包未做代码签名与公证）：
             · 右键点图标 → 打开 → 在弹窗里再点「打开」
             · 或：系统设置 → 隐私与安全性 → 拉到底 → 「仍要打开」
             · 或命令行：
               xattr -dr com.apple.quarantine /Applications/sourin_spike.app
          
          你的收藏 / 历史 / 播放进度保存在
          ~/Library/Containers/app.sourin.player/Data/app.sourin.player
          升级与卸载都不会动它。
          EOF
          echo "---- 暂存目录 ----"; ls -la "$STAGE"
          # ★ 打 DMG：UDZO（zlib 压缩、只读）是分发用的标准格式
          hdiutil create \
            -volname "源影" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG"
          ls -l "$DMG"
          # ── 自检 ①：DMG 必须能挂载（打坏了挂不上，但 hdiutil create 不报错）──
          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk '{print $NF}')
          echo "挂载点 = $MP"
          trap 'hdiutil detach "$MP" -quiet || true' EXIT
          # ── 自检 ②：三样东西都在 ──
          for p in "sourin_spike.app" "Applications" "安装说明.txt"; do
            if [ ! -e "$MP/$p" ]; then
              echo "::error::DMG 里缺少 $p"; exit 1
            fi
          done
          # ── 自检 ③：★ 最关键的一条 —— 挂载后的 .app 里必须有 Rust 核心，
          #   且**可执行位还在**（这正是 zip 做不到、而 DMG 必须做对的事）──
          CORE="$MP/sourin_spike.app/Contents/Frameworks/libsourin_core.dylib"
          if [ ! -f "$CORE" ]; then
            echo "::error::DMG 里的 .app 没有 libsourin_core.dylib —— 核心功能会全挂"; exit 1
          fi
          BIN="$MP/sourin_spike.app/Contents/MacOS/sourin_spike"
          if [ ! -x "$BIN" ]; then
            echo "::error::DMG 里的可执行文件丢了可执行位 —— 用户双击无反应"; exit 1
          fi
          # 符号数（与「核验产物」同一条判据，防 DMG 这一步漏掉内容）
          n=$(nm -gU "$CORE" 2>/dev/null | grep -c '_sourin_' || true)
          echo "DMG 内 Rust 核心导出符号数：$n"
          if [ "$n" -lt 7 ]; then
            echo "::error::DMG 内核心只有 $n 个 sourin_ 符号（应 >= 7）"; exit 1
          fi
          # ── 自检 ④：Applications 必须是软链而不是实体目录 ──
          if [ ! -L "$MP/Applications" ]; then
            echo "::error::Applications 不是软链（拖拽目标失效）"; exit 1
          fi
          echo "✓ DMG 结构与内容核验通过"
          hdiutil detach "$MP" -quiet || true
          trap - EXIT

      - name: 上传 Release zip + DMG（macOS）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: rel-macos-${{ inputs.release_tag }}
          # ★ zip 也一起发：DMG 是给「正常安装」的用户，
          #   zip 给要放进脚本/CI/受限环境的人。两者内容同源。
          path: |
            build/sourin-macos-${{ inputs.release_tag }}.zip
            build/sourin-macos-${{ inputs.release_tag }}.dmg
          retention-days: 1

  # ═════════════════════════════════════════════════════════════════════
  #  native-media —— 55 个带 `native-media` 标签的硬门禁（诊断用，**不拦合并**）
  #
  # ★★ 2026-10-19（复核纠正，Lead 改）：原先这里写「46 个」，
  #   而 **46 从写下那一刻就不是实测值** ——
  #   它出自 `8d57253`（2026-10-12）的 commit 标题，
  #   实测那个 commit 当时带 tag 的文件是 **44** 个。
  # ⇒ 本文件统一用两个**锚定了定义**的实测值（复核逐一定义核过）：
  #     带 `native-media` 标签的文件        = **55**
  #     其中真调 MediaKit.ensureInitialized = **43**
  #   ★ 「46」在数量级上没错，但精确值不可考 —— 下一个人若按不同定义去数
  #     会算出第三个数字（如 54、33）⇒ 所以必须写清**用的是哪个定义**。
  # ═════════════════════════════════════════════════════════════════════
  #
  #  # 为什么要有这个 job（这是本仓最大的一处「结构性假绿」）
  #
  #  `dart_test.yaml` 把 55 个带 native-media 标签的测试标了
  #  `native-media`，并让它们**默认 skip**（加载 libmpv 会让 flutter_tester
  #  偶发 native 崩溃 —— 实测：不加载崩 0/25、加载崩 6/25；串行 8 次红 5 次）。
  #  ⚠️ 代价是两个平台 job 跑的**裸** `flutter test`（windows:159 / macos:409）
  #     **从来看不见**这 55 个文件 —— 它们不是变红、也不是变绿，是**从没跑过**。
  #     而这里面恰恰是播放器 / 弹幕 / 片头片尾跳过这类**最核心**的硬门禁。
  #     ⇒ 一条 0/46 执行率、却常年「绿」的门禁，正是本仓明令禁止的假绿。
  #  本 job 的唯一目的：把真读数暴露出来（跑起来、记日志），**不为了绿而放宽**。
  #
  #  # 为什么**不**列进 required_status_checks（★ 关键设计约束）
  #
  #  崩溃根因在第三方 `libmpv-2.dll`，**我们改不了它的源码**（dart_test.yaml:60-61
  #  已写明）。若把它设成必需检查，主流程会**随机变红** ⇒ 团队很快会养成
  #  「重试直到绿」或「干脆删测试」的习惯 —— 那才是真正的反模式。
  #  `CONTRIBUTING.md` 的必需检查一栏（第 26 行）明确写着「只列**真的在验证东西**
  #  的那两个 job」，并在第 46-47 行点破：「列了也只是个恒过的门禁（本仓明令
  #  禁止『恒真的假门禁』）」。⇒ 它是**诊断用**的：让批次跑起来、把真读数摆出来，
  #  但由人去读结果，而不是让一个会随机翻脸的检查去否决合并。
  #
  #  # continue-on-error 为什么是**必须**的、而不是可选的
  #
  #  与上面同理：libmpv 的偶发崩溃会让本 job 随机失败。若不 `continue-on-error`，
  #  它会把**整个 workflow** 拖成失败态（`gh run view` 一级就显示红），
  #  而 windows / macos 是绿的 —— 读者无法一眼区分「核心 job 挂了」还是
  #  「只是诊断 job 又碰到那个已知崩溃」。所以：允许它失败（不阻塞其他 job、
  #  不阻塞合并），但**失败必须一眼可见** —— 见末尾那个 `if: failure()` 的汇总步。
  #
  #  # 为什么钉在**Windows** 而不是 macOS
  #
  #  Windows 的 libmpv 落在 `build/windows/x64/libmpv/libmpv-2.dll`。
  #
  # ★★★ 2026-10-19（Lead 修正，复核与实测各证一次）：
  #   本段原文写「`flutter pub get` 会触发 CMake 配置，CMake 在**配置期**下载并
  #   解包 mpv-dev 7z，落点正是 build/windows/x64/libmpv/」——
  #   而**本文件下方那段**（2026-10-12，CodeRabbit 指出、CI run 38241155183
  #   实测证实）明确说：**光 `flutter pub get` 供不出 libmpv-2.dll**。
  # ⇒ 实测赢：`pub get` 确实会触发 CMake **配置**，但**配置期不下载 mpv-dev**；
  #   真正供出 dll 的是 `flutter build windows`（搜 `- name: 构建 Windows 发布版`）。
  # ⇒ 后果与处置见下方两处：① 步骤注释已改「先决条件」的说法；
  #   ② windows 主 job 已加一条断言，在「核验产物」之后（那时 libmpv 必定存在）
  #      直接检查那 15 条门禁没有因为缺件而静默 skip。
  #
  # ★ 顺带修正一个数：原文写「37/55 个文件的 existsSync 守卫」——
  #   那个 37 与本 job 标题里的 46 出自**同一个 commit**（8d57253，2026-10-12），
  #   实测那个 commit 当时是 **33**（含该路径字面量的文件数），两个都不对。
  # ⇒ 现在实测：**45 个**带 tag 的文件里含
  #   `libmpv-2.dll` 路径字面量与 existsSync（复核 2026-10-19 逐个核过）。
  # ★ 且**不写分母** —— 带 tag 的文件数会随测试增删而变，写死分母必然再次漂移。
  #    （对照：macOS 侧 libmpv 是 dylib，路径与加载方式都不同，风险更大。）
  #
  #  # 触发条件：与 windows / macos **保持一致**（push / PR / workflow_dispatch）
  #
  #  沿用 PR + push 两条：① 结果面更大 —— 每次改播放器代码都能看到这批本来被
  #  隐藏的门禁到底什么读数，而不是等到有人手动触发才想起来；② `continue-on-error`
  #  已经让它**不可能**拖红主流程，所以多跑的代价只是时间，不是稳定性。
  #  （本 workflow 顶部的 `concurrency` 对 push 有 cancel-in-progress，
  #    PR 上则无 —— 连续推多次会累积几次本 job，属可接受。）
  #
  #  ⚠️ 已知残余局限（如实记录，别把它当完美门禁）：本 job 里
  #  （a）`SOURIN_SHOT_DIR` 未设 ⇒ 截图类文件（`@Tags(['needs-shot-dir'])`）仍默认 skip；
  #  （b）`USERPROFILE` 未隔离 ⇒ `needs-isolated-userprofile` 那类仍默认 skip；
  #  （c）**少数文件在 libmpv 缺失时是自己 `markTestSkipped` 的**，缺件时会走这条
  #      兜底路径而非硬失败 —— 所以真正能拿来当「硬门禁」读数的，是那些
  #      在 libmpv 就绪时**不**跳过的文件。`t118_control_bars_link_test.dart` 等 8 个
  #      文件为此提供了 `SOURIN_REQUIRE_LIBMPV=1` 的严格开关，**本 job 未开**：
  #      开了会让「缺件」从「如实 skip」变成「必红」，与 continue-on-error 的
  #      诊断定位相冲突。要核查这批文件有没有真的执行，请把输出按文件逐行读一遍。
  native-media:
    name: native-media（诊断，不拦合并）
    runs-on: windows-latest      # 理由见上：只有这条平台链在本地就能供出 libmpv-2.dll
    # ★ 45 → 60 分钟：本 job 本轮开始**真的**编 Rust 核心了（cargo build --release
    #   + rust-cache 冷缓存时约 5-10 分钟）。若还按 45 分钟，慢的那次会在
    #   「跑测试」中途被 timeout 杀掉 —— 那种红**没有任何分类价值**
    #   （只有 "The job running on runner ... has exceeded the maximum execution
    #   time"），恰好背离本 job「要有诊断价值」的唯一目的。
    timeout-minutes: 60
    # ★★ 不阻塞 workflow / 不阻塞合并（理由见上）。但它**仍然**会被记录成失败，
    #    供人查看 —— 只是不再把 windows / macos 的正常绿一起拖红。
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── ★★★ 本 job 此前**从来没有编过 Rust 核心**（2026-10-21 定位）─────
      #
      # # 现场
      # ```text
      # 747 行日志里 **723 行**是：
      #   Failed to load dynamic library 'sourin_core.dll': ...
      #   （Windows error code 126 = ERROR_MOD_NOT_FOUND）
      # -31 全是「找不到 dll」，外加一堆 `did not complete [E]` 误报。
      # ```
      # # 根因（不是 libmpv 的锅，别再去查第三方库）
      # ```text
      # windows job: cargo build --release  ← 只在这里（本 job 没有）
      # macos   job: cargo build --release  ← 只在这里（本 job 没有）
      # 本 job:      flutter pub get → flutter build windows → 直接跑测试
      #              ⇒ rust/…/target/release/sourin_core.dll **不存在**
      # 而 lib/core/ffi.dart:298 是裸文件名加载：
      #   `DynamicLibrary.open('sourin_core.dll')`
      # ⇒ LoadLibrary 按「exe 目录 → 系统目录 → 当前目录 → %PATH%」搜，
      #   这四处都没有那个文件 ⇒ err 126 ⇒ 每个碰 FFI 的用例都抛。
      # ```
      # ⇒ 补两步：装 Rust 工具链 + `cargo build --release`（与 windows job 同口径）。
      #   ★ 用 rust-cache 且 `workspaces: rust/sourin_core`：与 windows job
      #     缓存键一致 ⇒ 两个 job 命中同一份依赖缓存（不重复编译依赖）。
      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sourin_core

      - name: 编 Rust 核心（本 job 此前缺这一步）
        working-directory: rust/sourin_core
        run: cargo build --release

      # ★★ 2026-10-19（Lead 修正一段**自相矛盾的注释**）：
      #    这一段原本写「装依赖**必须**在跑测试之前 —— 它触发 CMake 配置，
      #    libmpv-2.dll 会落到 build/windows/x64/libmpv/」，
      #    而**紧邻下方 6 行**的那段（2026-10-12，CodeRabbit 指出、
      #    **已用 CI 实测证实**）明确说：**光 `flutter pub get` 供不出 libmpv-2.dll**。
      #
      # ⇒ 实测赢：CI 上真正供出 libmpv 的是**本 job 后面的
      #   「构建 Windows 发布版」**（`flutter build windows`），
      #   本 job 里的全量测试跑的时候 libmpv **不存在**。
      # ⇒ 所以现在有两个后果，都已处理：
      #   ① 依赖 libmpv 的门禁在 CI 上会 `markTestSkipped`（exit 0）
      #      ⇒ 本 job 已加一条断言，在「核验产物」之后（那时 libmpv 必定存在）
      #         直接检查「那 15 条没有因为缺件而静默 skip」，缺了就红。
      #   ② step 名字里的「（触发 libmpv 供给）」是**错的**，一并改掉。
      #
      # ⚠️ 若将来某个 SDK/插件版本让 `pub get` 真的能供出 dll，
      #    那这条断言会开始通过 —— 那正是它应有的行为（它只关心「有没有」）。
      - name: 装依赖
        run: flutter pub get

      # ══════════════════════════════════════════════════════════════════
      # ★★★ 2026-10-12（CodeRabbit 指出，**已用 CI 实测证实**）：
      #     光 `flutter pub get` **供不出** libmpv-2.dll
      # ══════════════════════════════════════════════════════════════════
      #
      # 本文件上面那句「flutter pub get 会触发 CMake 配置」是**不完整的** ——
      # 实测（run 38241155183：加上 `exit 1` 之后第一次真正暴露出来）：
      # ```text
      # 核验 libmpv 就位      ⇒ 打完 ::error:: 就 exit 1，**没有** "就位" 那行
      # 跑 native-media 门禁  ⇒ outcome=skipped（上一步已失败）
      # 汇总                  ⇒ "门禁未全过（outcome=skipped）"
      # ```
      # ⇒ **这个 job 此前一直在"空跑"** —— 46 条硬门禁一条没执行，
      #   而汇总里只写一句"通过"。正是本文件自己反复警告的那种假绿
      #   （加了 `exit 1` 之后，它才第一次**说出来**）。
      #
      # # 根因：少了真正触发 Windows 原生构建链的那一步
      # ```text
      # windows job: cargo build → flutter pub get → **flutter build windows**
      #              ↑ 真正触发 CMake / native 配置的是最后那一步
      # 本 job:      flutter pub get → 直接核验 ❌（从没编过 Windows 原生那半）
      # ```
      # ⇒ 补一步真正会走那条链的命令。
      #   ★ 用 `--debug` 而不是 `--release`：本 job 只为**供出 DLL**
      #     （debug 一样会编出 libmpv-2.dll），而 debug 快得多 ——
      #     这个 job 已是 45 分钟 timeout 的大户。
      #   ⚠️ 不传 `-t lib/shell.dart`：这里只借这条路触发 CMake 供件，
      #     产物不用于发版（发版在 windows job 里，那里传了 -t）。
      - name: 编 Windows 原生（触发 libmpv 供给 —— pub get 单独不够）
        run: flutter build windows --debug --no-pub

      # ★ 核验 libmpv 真的在路径上 —— 否则本 job 是在**空跑**，
      #   而那比不跑更糟（会让人以为门禁已经执行过了）。
      - name: 核验 libmpv 就位
        id: libmpv
        shell: pwsh
        run: |
          # ══════════════════════════════════════════════════════════════
          # ★★★ 必须 exit 1，不能只打 warning（CodeRabbit 点出，已核实）
          # ══════════════════════════════════════════════════════════════
          #
          # 本文件上面那段注释自己写着：少了 flutter pub get 这一步 ⇒
          # 「这批硬门禁在 CI 上仍然一条都没执行，只是从『被标签 skip』
          #   变成了『被守卫 skip』—— **换了个姿势的假绿**」。
          # 而只打 warning 恰好**就是**那个"换了个姿势"：job 继续跑、
          # 46 条门禁一条没执行、汇总里也只写一句"就位检查成功"。
          #
          # ★ 本仓铁律（CONTRIBUTING.md）：
          #   「任何『只打 warning 不 exit 1』的门禁都是假门禁」。
          # ⇒ 前置条件不满足时**直接判红**。`if: always()` 的汇总步
          #   仍会执行、仍会写 job summary（摘要不会因此丢失）。
          $mpv = 'build/windows/x64/libmpv/libmpv-2.dll'
          if (-not (Test-Path $mpv)) {
            Write-Host '::error::libmpv-2.dll 不在 build/windows/x64/libmpv/ —— 依赖真播放器的用例会静默跳过（假绿）'
            Write-Host '  期望来源：media_kit_libs_windows_video 的 CMake（flutter pub get 时供给）'
            exit 1
          }
          "libmpv-2.dll = " + (Get-Item $mpv).Length + " 字节（就位）"

      # ── ★★★ 把两个 dll 放进「测试一定能找到」的位置 ────────────────────
      #
      # # 为什么「编出来」还不够
      # ```text
      # 编译产物在  rust/sourin_core/target/release/sourin_core.dll
      # 而代码按**裸文件名**加载（lib/core/ffi.dart:298）：
      #   DynamicLibrary.open('sourin_core.dll')
      # ⇒ LoadLibrary 的搜索序列是
      #     exe 目录(flutter_tester.exe 所在) → 系统目录 → 当前目录 → %PATH%
      #   这里面**没有** target/release
      # ⇒ 「有 dll」≠「能加载」；这一步就是把前者变成后者。
      # ```
      # # 为什么同时走两条路（%PATH% + 工作目录），不是重复
      # ```text
      # ① 追加到 $GITHUB_PATH ⇒ 对**后续所有步骤**生效（含 flutter test 拉起的
      #    flutter_tester.exe）。libmpv 只能走这条：media_kit 的报错原文就是
      #      "Cannot find libmpv-2.dll in your system %PATH%"
      # ② 顺便把 sourin_core.dll 拷一份到仓库根（= `flutter test` 的工作目录）：
      #    万一将来有人开了「禁止从当前目录搜 dll」的策略（CWDIllegalInDllSearch
      #    一类），① 仍能兜住；反过来若子进程环境被裁剪掉 PATH，② 仍能兜住。
      # ```
      # # 为什么要在这里做一次「真加载」自检
      # ```text
      # 不做的话，dll 搜索路径配错的唯一症状是「55 个文件各报一遍 error 126」
      # —— 也就是本 job 此前那 723 行。⇒ 在这一步用 .NET 的 NativeLibrary
      # 按**裸名**加载一次：成不成、缺什么依赖，3 行内就有答案。
      # ★ 缺件/加载失败一律 exit 1（不打 warning）：本仓铁律
      #   「只打 warning 不 exit 1 的门禁都是假门禁」。
      # ```
      - name: 把 sourin_core / libmpv 放进测试的搜索路径（并真加载自检）
        id: dlls
        shell: pwsh
        run: |
          $core = 'rust/sourin_core/target/release/sourin_core.dll'
          $mpv = 'build/windows/x64/libmpv/libmpv-2.dll'
          foreach ($p in @($core, $mpv)) {
            if (-not (Test-Path $p)) {
              Write-Host "::error::缺少 $p ⇒ 后面的测试只会得到一堆 error 126，那是**无效读数**"
              exit 1
            }
          }
          # ② 拷一份到仓库根（`flutter test` 的工作目录）
          Copy-Item $core . -Force
          "仓库根的 sourin_core.dll = " + (Get-Item 'sourin_core.dll').Length + " 字节"
          # ① 两个目录进 %PATH%（$GITHUB_PATH 影响后续步骤，$env:PATH 影响本步）
          $dirs = @(
            (Resolve-Path (Split-Path $core)).Path
            (Resolve-Path (Split-Path $mpv )).Path
          )
          foreach ($d in $dirs) { Add-Content -Path $env:GITHUB_PATH -Value $d }
          $env:PATH = ($dirs -join ';') + ';' + $env:PATH
          "已加入 %PATH%：" + ($dirs -join ' ; ')
          # 自检：按**裸名**加载（与 Dart 侧 DynamicLibrary.open 同一个搜索面）
          foreach ($n in @('sourin_core.dll', 'libmpv-2.dll')) {
            try {
              $h = [System.Runtime.InteropServices.NativeLibrary]::Load($n)
              [System.Runtime.InteropServices.NativeLibrary]::Free($h)
              "  ✅ 真加载成功：$n"
            } catch {
              Write-Host "::error::按裸名加载 $n 失败：$($_.Exception.Message)"
              Write-Host "  ⇒ 搜索路径仍未配好；后面那 ~720 行 error 126 都是这个原因"
              exit 1
            }
          }

      # ★★ 带 native-media 标签的那 55 个硬门禁 —— 默认被 dart_test.yaml skip，
      #    必须 --run-skipped 才会跑；--tags native-media 只选这一批；
      #    --concurrency=1 是 dart_test.yaml:57 明写的（串行**降低**、但**不能消除**
      #    崩溃率 —— 实测串行仍会红，所以本 job 继续 keep continue-on-error）。
      # ⚠️ 别删 :159 那条裸 `flutter test`：它跑的是**默认套件**，与本 job 互补，
      #    不是重复。
      - name: 跑 native-media 硬门禁（--run-skipped --tags native-media --concurrency=1）
        id: tests
        shell: pwsh
        run: |
          # ★ 为什么必须 tee 到文件：这一步失败时真正的分类依据（error 126 /
          #   断言失败 / did not complete）只有**在日志文本上**数得出来，
          #   而 `flutter test` 末尾的摘要会把每一类的细节冲散。
          # ★★★ $ErrorActionPreference 必须是 'Continue'（实测踩过，别改回 'Stop'）：
          #   在 'Stop' 下，`2>&1 | Tee-Object` 里第一条 stderr 行会被包成
          #   NativeCommandError **异常**直接中断脚本 ⇒ tee 半途收工、
          #   $LASTEXITCODE 读不到真值 ⇒ 真红的测试变成假绿（正是要消灭的东西）。
          $ErrorActionPreference = 'Continue'
          $log = 'native-media.log'
          flutter test test/ --run-skipped --tags native-media --concurrency=1 --reporter expanded 2>&1 |
            Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($null -eq $rc) { $rc = 1 }   # 命令根本没起来（$LASTEXITCODE 未置）也当红
          "flutter test exit code = $rc（完整输出已写入 $log）"
          if (-not (Test-Path $log)) {
            Write-Host "::error::没生成 $log ⇒ 失败分类无从下手（不能算通过）"
            exit 1
          }
          # ★ 真红要真红：把 flutter test 的退出码**原样**带出去
          #   （native 崩溃时是 79，断言失败是 1 —— 都别抹平成 1，
          #    那个数字本身就在告诉读日志的人「这是哪种失败」）。
          if ($rc -ne 0) { exit $rc }

      # ★ 让失败**一眼可见**（不阻塞，但要被人读到）：把本 job 的结果与上面各步的
      #   结论汇总到 job 摘要里。`continue-on-error` 会让步骤本身报绿，所以这里
      #   按 `steps.*.outcome`（真实结果）而不是 `conclusion`（可能被覆盖）来判。
      # ★★★ 2026-10-21 本轮改动：以前这里只写「未全过，请展开日志看是断言失败还是
      #   偶发崩溃」—— 把分类工作**推给读日志的人**。而「分类」恰好是本 job 唯一的
      #   价值（它是诊断 job，不拦合并）。现在改成：在日志文本上**数出来**。
      #   ⚠️ 全部用 -SimpleMatch（字面量匹配）：`[E]` 若按正则解释会被当成字符类，
      #      于是数出 0 条 —— 这种「假 0」比没有分类更坏。
      - name: 汇总（失败要一眼可见，但不阻塞）
        if: always()
        shell: pwsh
        run: |
          $mpv  = 'build/windows/x64/libmpv/libmpv-2.dll'
          $core = 'rust/sourin_core/target/release/sourin_core.dll'
          $mpvOk  = Test-Path $mpv
          $coreOk = Test-Path $core
          $fixtureOutcome = '${{ steps.libmpv.outcome }}'
          $dllsOutcome    = '${{ steps.dlls.outcome }}'
          $testOutcome    = '${{ steps.tests.outcome }}'

          # ── 失败分类：在 native-media.log 上数，不靠人眼 ────────────────
          $hasLog = Test-Path 'native-media.log'
          $nLoadFail = 0; $nDnc = 0; $nE = 0; $rcLog = '未捕获'
          if ($hasLog) {
            $lines = Get-Content -LiteralPath 'native-media.log' -Encoding UTF8
            $nLoadFail = @($lines | Select-String -SimpleMatch 'Failed to load dynamic library').Count
            $nDnc      = @($lines | Select-String -SimpleMatch 'did not complete').Count
            $nE        = @($lines | Select-String -SimpleMatch '[E]').Count
            $hit = @($lines | Select-String -SimpleMatch 'flutter test exit code = ')
            if ($hit.Count -gt 0) { $rcLog = ($hit[-1].Line -replace '.*exit code = (\d+).*', '$1') }
          }
          # 断言类 ≈ [E] 总数 − did not complete 数（启发式：两类有重叠，
          # 标签里写明「启发式」，不假装精确）
          $nAssert = [Math]::Max(0, $nE - $nDnc)

          "## native-media（诊断 job，不拦合并）" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 步骤 | 结果 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Rust 核心已编出（sourin_core.dll） | $(if ($coreOk) { 'OK' } else { '缺' }) |" >> $env:GITHUB_STEP_SUMMARY
          "| libmpv 核验 | $fixtureOutcome |" >> $env:GITHUB_STEP_SUMMARY
          "| 两个 dll 进搜索路径 + 真加载自检 | $dllsOutcome |" >> $env:GITHUB_STEP_SUMMARY
          "| 55 个 native-media 硬门禁 | $testOutcome |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY

          if (-not $hasLog) {
            "❌ **没有 native-media.log** ⇒ 测试步骤根本没跑起来，本次**没有任何读数**（不是「通过」）。" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "### 失败分类（从 native-media.log 数出来的）" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "| 类别 | 次数 | 含义 |" >> $env:GITHUB_STEP_SUMMARY
            "|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
            "| dll 加载失败（error 126） | $nLoadFail | 构建产物/搜索路径缺失 ⇒ 整份读数无效 |" >> $env:GITHUB_STEP_SUMMARY
            "| did not complete | $nDnc | 用例没跑完（native 崩溃或超时，常伴 exit 79） |" >> $env:GITHUB_STEP_SUMMARY
            "| 失败标记 [E] | $nE | 所有失败条目（含上面两类） |" >> $env:GITHUB_STEP_SUMMARY
            "| 断言类（启发式） | $nAssert | [E] 总数 − did not complete 数 |" >> $env:GITHUB_STEP_SUMMARY
            "| flutter test 退出码 | $rcLog | 79=native 崩溃；1=断言失败 |" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
          }

          # ── 判据（互斥的 if/elseif 链：一次只吐**一段**结论，不堆砖）──────
          # ★ 顺序即优先级，且**没有日志单独成一档**：「没跑起来」与「跑完了但红」
          #   必须分开，否则「没有读数」会被渲染成「断言失败」—— 那正是本 job
          #   以前最招人恨的那类误报（[E] ×0 却报「断言失败为主」）。
          if (-not $mpvOk -or -not $coreOk) {
            "❌ 前置件缺失（libmpv=$mpvOk / sourin_core=$coreOk）⇒ 本 job 的读数**不代表**那 55 个门禁真的执行过，请先修供给链。" >> $env:GITHUB_STEP_SUMMARY
          }
          if (-not $hasLog) {
            # 摘要里那句话上面「表格 vs 分类」那段已经写过了，这里只补注解，不重复。
            Write-Host "::error::native-media 无读数：native-media.log 不存在（测试步骤没跑起来）"
          } elseif ($nLoadFail -gt 0) {
            "❌ **分类：dll 加载失败为主因**（$nLoadFail 次）。这不是用例的问题：本 job 以前既没编 Rust 核心、dll 也不在搜索路径 —— 这一栏非 0 说明那两处修复没生效，整份读数**无效**。" >> $env:GITHUB_STEP_SUMMARY
            Write-Host "::error::native-media 读数无效：$nLoadFail 次 dll 加载失败（error 126）—— 先修构建/搜索路径"
          } elseif ($testOutcome -eq 'success') {
            "✅ 55 个门禁本次**全过**（偶发 native 崩溃仍可能复现，见 dart_test.yaml）。" >> $env:GITHUB_STEP_SUMMARY
          } elseif ($nDnc -gt 0) {
            "❌ **分类：用例没跑完**（did not complete ×$nDnc，退出码 $rcLog）。多为 native 崩溃/超时而非断言不符 —— 属 dart_test.yaml 记过的已知噪声，但**别因它放过**：连跑多次都绿才说明不是功能回退。" >> $env:GITHUB_STEP_SUMMARY
          } elseif ($nE -gt 0) {
            "❌ **分类：断言失败为主**（[E] ×$nE，启发式断言类 ×$nAssert，退出码 $rcLog）。这类是**真读数**，请展开上面的日志逐个看。" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "❌ **分类：红在测试开始之前**（退出码 $rcLog，但日志里 [E] ×0、did not complete ×0、error 126 ×0）。⇒ 失败发生在 fixture 构建 / pub get / flutter build 阶段，不是用例断言 —— 去上面的步骤日志里找。" >> $env:GITHUB_STEP_SUMMARY
          }
          "★ 本 job 是**诊断用**、continue-on-error 已开 ⇒ 它**不**阻塞合并。" >> $env:GITHUB_STEP_SUMMARY

          if ($testOutcome -ne 'success') {
            Write-Host "::warning::native-media 门禁未全过（outcome=$testOutcome，dll失败=$nLoadFail，未跑完=$nDnc）—— 诊断用，不阻塞合并"
          }

  # ═════════════════════════════════════════════════════════════════════
  #  Android（手机 + TV 同一个 APK）—— 默认关闭
  # ═════════════════════════════════════════════════════════════════════
  #
  # ⚠️ 手动触发 android 时**必然同时重跑 windows 与 macOS** ——
  #   它们是这个 workflow 的必跑 job（`if:` 只加在 android 上）。
  #   所以「只想验 android」也要按一次三端的时间预算（约 30-50 分钟）。
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ★ 发版时把全局的 SOURIN_VERSION 从空串覆盖成真正的 tag；
      #   非发版构建保持全局的空串 ⇒ App 读不到 dart-define，
      #   回退到 pubspec 的版本号（见 lib/core/app_update/app_version.dart）。
      SOURIN_VERSION: ${{ inputs.release_tag }}

      # ★ 外部弹幕服务的官方凭证（DANDANPLAY_APP_ID / APP_SECRET）**不在这里**声明：
      #   它只挂在下一条「构建 APK（按 ABI 拆分 —— arm64 + armv7）」这一步的
      #   env: 上。为什么不能放 job 级：job 级 env 会注入到**本 job 的每一个
      #   步骤**，于是「全量测试」与若干第三方 Action（checkout / flutter-action /
      #   rust-toolchain / …）都能读到 Secret。凭证只有构建那一步需要 ⇒ 就只给
      #   那一步（最小权限原则，对应 CWE-94 的注入面收窄）。

    if: github.event_name == 'workflow_dispatch' && inputs.build_android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sourin_core

      - name: 装 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          # ★ 版本必须与 rust/sourin_core/.cargo/config.toml.example 里的一致
          ndk-version: r27
          link-to-sdk: true

      - name: 编 Android 的 Rust 核心
        shell: bash
        working-directory: rust/sourin_core
        run: |
          set -euo pipefail
          # ★ 仓库里的 .cargo/config.toml.example 写的是 Windows 路径，
          #   Linux CI 上用环境变量覆盖（Cargo 读 CARGO_TARGET_<三斜线大写>_LINKER）。
          NDKBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDKBIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDKBIN/armv7a-linux-androideabi24-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export CC_armv7_linux_androideabi="$CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
          # ★★★ NDKBIN 必须进 PATH —— 少了这行 `ring` 起不来（2026-10-08 实测，见下）
          #
          #   cc-rs 找**归档器**（ar/ranlib）的逻辑（`cc-1.4.7/src/lib.rs:3801-3820`）：
          #     target.os == "android" ⇒ 先试 `llvm-ar --version`；探测失败才退到
          #     `{raw_target.replace("armv7","arm")}-ar` 这种**根本不存在**的名字。
          #   NDK 的 bin 目录里**只有** `llvm-ar`，**没有** `aarch64-linux-android-ar`
          #   （本机实测：`llvm-ar.exe` exists=True / `aarch64-linux-android-ar` exists=False，
          #     r27 与 r28 都一样）⇒ 不把 NDKBIN 放进 PATH，那个探测必然失败。
          #
          #   ★ 实测报错逐字（run 37759463600 的「编 Android 的 Rust 核心」步）：
          #       error: failed to run custom build command for `ring v0.17.14`
          #         error occurred in cc-rs: failed to find tool "aarch64-linux-android-ar":
          #         No such file or directory (os error 2)
          #     `ring` 是 reqwest 的 rustls-tls 依赖，**绕不过去**。
          #
          #   ★ 这也正是 `.cargo/config.toml.example` 里记的本机做法
          #     （`$env:PATH = "$ndk;$env:PATH"`）—— CI 先前漏了这一步。
          export PATH="$NDKBIN:$PATH"
          # ★ 再加一条**显式兜底**（不依赖 PATH）：cc-rs 的 `target_envs`
          #   （`cc-1.4.7/src/lib.rs:4296-4311`）第一批优先级就是 `AR_<target_下划线>`。
          #   两套并存：PATH 让 cc-rs 走它设计好的 `llvm-ar` 探测路径，
          #   `AR_*` 保证即使哪天 PATH 被人改坏也仍然能找到归档器。
          #   （对照实验：两组**各自单独**都够用 —— 只加 PATH 得 0，只加 AR_* 也得 0，
          #     都不加必红 exit=101。两条并存是防御性的。）
          #
          #   ⚠️ 调试这个问题的坑：cc-rs 只在 `AR_*` 这类**具名**环境变量上 emit
          #     `cargo:rerun-if-env-changed`（`cc-1.4.7/src/lib.rs:4249-4251`，`v != "PATH"`）
          #     ⇒ **改 PATH 不会触发 ring 重建**。靠改 PATH 做对照实验时，
          #     必须先手动删 `target/*/release/build/ring-*` 与 `.fingerprint/ring-*`，
          #     否则看到的永远是缓存里的旧结果。
          export AR_aarch64_linux_android="$NDKBIN/llvm-ar"
          export AR_armv7_linux_androideabi="$NDKBIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDKBIN/llvm-ranlib"
          export RANLIB_armv7_linux_androideabi="$NDKBIN/llvm-ranlib"
          echo "PATH 里的归档器：llvm-ar = $(command -v llvm-ar || echo '(找不到！') )"
          echo "                llvm-ranlib = $(command -v llvm-ranlib || echo '(找不到！') )"
          echo "显式 ARCHIVER  = $AR_aarch64_linux_android / $AR_armv7_linux_androideabi"
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi

      - name: 拷进 jniLibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp rust/sourin_core/target/aarch64-linux-android/release/libsourin_core.so \
             android/app/src/main/jniLibs/arm64-v8a/
          cp rust/sourin_core/target/armv7-linux-androideabi/release/libsourin_core.so \
             android/app/src/main/jniLibs/armeabi-v7a/
          # ★ 核验导出符号：改完 ffi.rs 没重编那个 ABI 的话，
          #   符号数会少 —— 表现为「所有命令都超时」，最难查的那类。
          for abi in arm64-v8a armeabi-v7a; do
            n=$(strings android/app/src/main/jniLibs/$abi/libsourin_core.so | grep -c "^sourin_")
            echo "$abi 导出符号数 = $n"
            if [ "$n" -lt 7 ]; then
              echo "::error::$abi 的 .so 只有 $n 个 sourin_ 符号（应为 7 个）—— 核心没重编"; exit 1
            fi
          done

      - name: 装依赖
        run: flutter pub get

      # ═══════════════════════════════════════════════════════════════════
      # ★★★ 为什么是「一次 --split-per-abi」而不是「两次 --target-platform」
      # ═══════════════════════════════════════════════════════════════════
      #
      # ① 原来第二次写的是 --target-platform android-armv7 —— **不是合法取值**。
      #    flutter_tools/src/commands/build_apk.dart:51-55 的 allowed 只有
      #      [android-arm, android-arm64, android-x64]
      #    实测报错：android-armv7 is not an allowed value for option --target-platform
      #    ⇒ 这一步**必红** ⇒ 整个 android job 在这里就退出 ⇒
      #      **永远走不到**下面的 badging 核验 ⇒ TV 契约门禁从没真正执行过一次。
      #
      # ② 就算把名字改对，两次单 ABI 构建的产物**都叫 app-release.apk**
      #    （gradle.dart:157 _apkFilesFor 在非 split 时只返回这一个名字）
      #    ⇒ 第二次会**覆盖**第一次 ⇒ 上传的其实只有一个 APK。
      #
      # ⇒ 正解是 --split-per-abi：gradle.dart:151-155 里
      #    app-$abi-$buildType.apk ⇒ 一次产出按 ABI 命名的多个 APK。
      #
      # ★ --target-platform android-arm64,android-arm 是**故意**只留这两个，
      #   理由有两条（第二条是硬缺陷，不是体积问题）：
      #   ① 交付件就是这两个（arm64 手机/TV 盒子 + armv7 老设备）；
      #      x86_64 那份约 50 MB，只给模拟器用，不进交付包。
      #   ② ★★ 上面「拷进 jniLibs」只拷了 arm64-v8a 与 armeabi-v7a 两个 ABI，
      #      **没有 x86_64**。若这里按默认三个 ABI 拆，x86_64 那个 APK 里
      #      就**不含 libsourin_core.so** —— 装到 x86_64 设备/模拟器上
      #      一调核心就 DynamicLibrary.open 失败。而下面的「上传 APK」是
      #      `*.apk` 全量上传 ⇒ 用户会拿到一个**静默残废**的包。
      #      ⇒ 宁可不构建，也不产出一个缺核心库的 APK。
      - name: 构建 APK（按 ABI 拆分 —— arm64 + armv7）
        # ⚠️ 这里的 ABI 列表必须与上面「拷进 jniLibs」的目录列表**保持一致**：
        #   那边只有 arm64-v8a 与 armeabi-v7a（没有 x86_64）⇒ 若这里加回三个 ABI，
        #   x86_64 那个 APK 里就会**不含 libsourin_core.so**，而下面「上传 APK」是
        #   `*.apk` 全量上传 ⇒ 用户会拿到一个**静默残废**的包（装上一调核心就 open 失败）。
        #   要加 x86_64，必须先在「拷进 jniLibs」里加上 x86_64 的交叉编译与拷贝。
        # ★ 凭证 env 只挂在这一步（最小权限，理由见上面 job 里的说明）。
        # ★ 用 $NAME 展开（Android 这一步是 bash）：Secret 内容作为环境变量值
        #   被 --dart-define 直接取用（命令行是参数数组，不经 shell 二次解析），
        #   Secret 里含双引号 / $ / 反引号也不会改变命令解析（CWE-94）。
        # ★ --dart-define=SOURIN_VERSION 让 App 知道自己是谁（发版时为 tag）
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: >-
          flutter build apk --release --no-pub --split-per-abi
          --target-platform android-arm64,android-arm -t lib/shell.dart
          --dart-define=SOURIN_VERSION=${{ env.SOURIN_VERSION }}
          --dart-define=DANDANPLAY_APP_ID="$DANDANPLAY_APP_ID"
          --dart-define=DANDANPLAY_APP_SECRET="$DANDANPLAY_APP_SECRET"

      - name: 核验 APK 的 Android TV 入口（手机入口 + TV 入口都要在）
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          # ★ --split-per-abi **不产** app-release.apk（见上面那段注释）⇒
          #   这里必须扫目录，不能再 ls 一个写死的文件名：
          #   在干净 runner 上会 ls 失败；在开发机上则会**误测上一轮的旧包**（假绿）。
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::build/app/outputs/flutter-apk/ 下没有任何 .apk —— 构建没产出"; exit 1
          fi
          echo "待核验的 APK（${#APKS[@]} 个）：${APKS[*]}"
          for APK in "${APKS[@]}"; do
            echo "--- $APK"
            # ★★ 硬门禁用 xmltree 查 AndroidManifest 的**原始 category**：
            #   dump badging 的输出里**根本没有** LEANBACK_LAUNCHER 这个字符串
            #   （实测：badging 116 行里 has LEANBACK_LAUNCHER = False），
            #   它只把 TV 入口规范化成 leanback-launchable-activity 那一行；
            #   原始 category 只在 xmltree 里。
            #   ⇒ 旧判据 grep LEANBACK_LAUNCHER **永远为假** ⇒ 每次都走 warning
            #     ⇒ 那是一条**假门禁**（不会失败，只会一直警告 —— 比红更糟，
            #       红会被看见，警告会被忽略）。本仓铁律：
            #       一条永远为真的断言比没有断言更危险。
            #   ★ 两个 category 都查：LEANBACK 保证 TV 上能找到应用，
            #     LAUNCHER 保证手机/平板桌面上还有图标（缺它 = 手机装完没图标）。
            "$SDK/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
            for cat in "android.intent.category.LAUNCHER" "android.intent.category.LEANBACK_LAUNCHER"; do
              if ! grep -q "$cat" /tmp/manifest.txt; then
                echo "::error::$APK 的 AndroidManifest 缺少 $cat"; exit 1
              fi
            done
            # ★ 再把 badging 的规范化行打出来给人看 —— 它正是 Android 系统
            #   实际认出来的 TV 入口，读起来比 xmltree 直观。
            "$SDK/aapt" dump badging "$APK" > /tmp/badging.txt || true
            grep -E "leanback|launchable-activity" /tmp/badging.txt || true
            if ! grep -q "leanback-launchable-activity:" /tmp/badging.txt; then
              echo "::error::$APK 没有 leanback 启动入口，Android TV 上装不进去"; exit 1
            fi
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: sourin-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # ── 发 Release 用的 APK 改名（只在填了 release_tag 时才跑）────────
      #   ★ 为什么要改名：`--split-per-abi` 产出的名字是
      #     `app-arm64-v8a-release.apk` / `app-armeabi-v7a-release.apk`，
      #     名字里**没有产品名**，用户在下载页看到两个都叫 app-* 的文件
      #     根本分不出哪个是哪个。改成带产品名 + 架构的名字。
      #   ★ 顺带核验：两个 ABI 的 .so 必须都在（`--split-per-abi` 只会
      #     打 jniLibs 里**存在**的 ABI ⇒ 少拷一个不会报错，只会静默出
      #     一个装不上的包）。
      - name: 准备 Release 用的 APK
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          TAG="${{ inputs.release_tag }}"
          OUT="build/rel-apk"
          rm -rf "$OUT"; mkdir -p "$OUT"
          SRC="build/app/outputs/flutter-apk"
          cp "$SRC/app-arm64-v8a-release.apk"   "$OUT/sourin-android-arm64-$TAG.apk"
          cp "$SRC/app-armeabi-v7a-release.apk" "$OUT/sourin-android-armv7-$TAG.apk"
          ls -l "$OUT"
          # ★ 自检：每个 APK 里都必须真的有对应的 libsourin_core.so
          for pair in "sourin-android-arm64-$TAG.apk:lib/arm64-v8a/libsourin_core.so" \
                      "sourin-android-armv7-$TAG.apk:lib/armeabi-v7a/libsourin_core.so"; do
            apk="${pair%%:*}"; want="${pair##*:}"
            if ! unzip -l "$OUT/$apk" | grep -q "$want"; then
              echo "::error::$apk 里没有 $want"; exit 1
            fi
            echo "✓ $apk 含 $want"
          done

      - name: 上传 Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: rel-android-${{ inputs.release_tag }}
          path: build/rel-apk/*.apk
          retention-days: 1


  # ═════════════════════════════════════════════════════════════════════
  #  发 Release —— 只有填了 release_tag 才跑
  # ═════════════════════════════════════════════════════════════════════
  #
  #  # 为什么要有这个 job（而不是本地下载 artifact 再手动上传）
  #
  #  artifact 的下载要走 `api.github.com` → **Azure blob 的 SAS 重定向**。
  #  实测：那条链路在部分网络环境下只有几十 KB/s —— 40MB 的 Windows 包要
  #  十几分钟，125MB 的 macOS 包要一小时以上，而且中途会被截断。
  #  ⇒ 正确做法是让 **runner 自己**把成品传上去：runner 与 GitHub 之间
  #    是机房直连。所以三个 job 各自在打包后额外压一份 `rel-*` artifact，
  #    本 job 只负责把它们汇总成 Release（含 Windows 的 NSIS 安装包）。
  #
  #  # 为什么用 `gh release create` 而不是 softprops/action-gh-release
  #
  #  `gh` 是 GitHub 官方 CLI，随 runner 预装，不需要引第三方 action
  #  （少一个供应链面）。
  #
  #  # 为什么 `if: always()`
  #
  #  三个平台 job 是并行的。若某个平台挂了，我们**仍要**发已经好的那些包，
  #  而不是因为一个平台失败就什么都不发 —— 但下面会显式检查每个平台
  #  是否 success，**没成功就不带它的包**，绝不发半成品。
  publish:
    name: 发 Release
    runs-on: ubuntu-latest
    needs: [windows, macos, android]
    # ★ 注意 `always()`：needs 里有 skipped（android 默认跳过）时，
    #   不加它整个 job 会被跳过。
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    permissions:
      # ★★ 一旦写了 `permissions:`，**没列出来的权限全部变成 none** ——
      #   这是 GitHub 的规则（不是「保持默认」）。
      #   `actions/download-artifact` 要用 Actions API 列产物 ⇒ 必须要
      #   `actions: read`；漏了它会报 403/Resource not accessible。
      actions: read
      contents: write      # 建 Release 要写权限

    steps:
      # ★ 必须先 checkout：`--notes-file .github/release-notes.md` 是**仓库里的文件**，
      #   不 checkout 的话 publish job 的工作目录是空的，gh 会报找不到 notes。
      - name: 检出代码（为了读 release-notes.md）
        uses: actions/checkout@v4
        with:
          # ★★★ 2026-10-19（批末复核查出）：原来没写 `with:`，
          #   checkout@v4 默认 `fetch-depth: 1` + `fetch-tags: false`
          #   ⇒ **本地一个 tag 都没有** ⇒ `git describe --tags` 必失败
          #   ⇒ 被误判成「首个 release」⇒ 要么 exit 2 发不出去，
          #     要么输出「本版无用户可见变更」照常发布
          #   ⇒ 修复上线后**第一次发版就会复现 Owner 的抱怨**。
          #   `fetch-depth: 0` = 完整历史与全部 tag，describe 才能工作。
          fetch-depth: 0

      - name: 汇总三个平台的包
        uses: actions/download-artifact@v4
        # ★ 一个 `rel-*` 都没有时（三个平台全挂），这个 action 会**硬失败**并
        #   报一句难懂的 'no artifacts found'。用 continue-on-error 让流程走到
        #   下一步，由那里给出「三个平台都没有可用产物」的明确错误。
        continue-on-error: true
        with:
          pattern: rel-*
          merge-multiple: true
          path: rel

      - name: 核验拿到了什么（没拿到就早失败）
        id: chk
        run: |
          TAG="${{ inputs.release_tag }}"
          echo "---- rel/ 内容 ----"
          ls -lR rel || true
          echo ""
          W="rel/sourin-windows-$TAG.zip"
          M="rel/sourin-macos-$TAG.zip"
          D="rel/sourin-macos-$TAG.dmg"
          A64="rel/sourin-android-arm64-$TAG.apk"
          A7="rel/sourin-android-armv7-$TAG.apk"
          # ★ 安装包（可安装版）。版本号是 tag 去掉前导 v。
          SETUP="rel/Sourin-Setup-${TAG#v}.exe"
          FILES=""
          # ★ 逐个平台判定：Windows / macOS 是必跑 job，没产物就是真失败；
          #   Android 默认不跑，所以它缺席是正常的（不报错，只是不发 APK）。
          if [ "${{ needs.windows.result }}" = "success" ] && [ -f "$W" ]; then
            FILES="$FILES $W"; echo "✓ Windows  $W";
            # ★ 安装包跟着 Windows 一起判定：它就是在 Windows job 里编的。
            #   若它不在，说明安装包那一步没产出 —— 那是个真问题，要说出来，
            #   但**不阻塞** zip 的发布（zip 本身是可用的免安装版）。
            if [ -f "$SETUP" ]; then FILES="$FILES $SETUP"; echo "✓ 安装包    $SETUP";
            else echo "::warning::Windows 安装包 $SETUP 不在 —— 本次只发免安装版"; fi
          else echo "✗ Windows 包不可用（job=${{ needs.windows.result }}）"; fi
          if [ "${{ needs.macos.result }}" = "success" ] && [ -f "$M" ]; then
            FILES="$FILES $M"; echo "✓ macOS    $M";
            if [ -f "$D" ]; then FILES="$FILES $D"; echo "✓ macOS dmg $D";
            else echo "::warning::macOS DMG $D 不在 —— 本次只发 zip"; fi
          else echo "✗ macOS 包不可用（job=${{ needs.macos.result }}）"; fi
          # ★★★ 2026-10-14（CR #25）：**产物文件**缺失也要硬失败。
          #
          #   # 上面那条 job 结果断言为什么不够（CR 指出的真洞）
          #   ```text
          #   job 返回 success **不等于** rel/ 下有它的包 ——
          #   artifact 下载/路径结构出问题时，job 是绿的、文件却没到。
          #   而那时上面只打了一行 `✗ macOS 包不可用`，
          #   ★ 只要 Windows 的文件在 ⇒ `FILES` 非空 ⇒ **Release 照发**，
          #     只是**少了整个 macOS 平台** —— 正是本 job 存在的意义要防的那件事。
          #   ```
          #   ⇒ 与 Windows 同样处理：**文件缺席 = 硬失败**。
          #   ★ 判据用"文件在不在"（结果）而不是"job 绿不绿"（过程）——
          #     后者我们已经有了，两条**都要**（job 红 → 早失败；文件缺 → 也失败）。
          if [ "${{ needs.windows.result }}" = "success" ] && [ ! -f "$W" ]; then
            echo "::error::Windows job 绿，但 $W 不在 rel/ 下 —— 拒绝发一个缺 Windows 包的 Release"
            ls -la rel || true
            exit 1
          fi
          if [ "${{ needs.macos.result }}" = "success" ] && [ ! -f "$M" ]; then
            echo "::error::macOS job 绿，但 $M 不在 rel/ 下 —— 拒绝发一个缺 macOS 包的 Release"
            ls -la rel || true
            exit 1
          fi
          if [ "${{ needs.android.result }}" = "success" ] && [ -f "$A64" ] && [ -f "$A7" ]; then
            FILES="$FILES $A64 $A7"; echo "✓ Android  $A64 $A7";
          else echo "· Android 未构建（job=${{ needs.android.result }}）—— 不发布 APK"; fi
          # ★★ 硬断言：**必跑平台**（Windows / macOS）没有产物 ⇒ 直接红。
          #
          #   为什么必须红（run 38384556818 的真实事故，v1.1.0）：
          #   Windows job 的「装 NSIS」被 choco 的 504 打挂 ⇒ 整个 Windows job 红
          #   ⇒ rel-windows-* 没上传 ⇒ 本 job 上面那几条只打了行 `✗ Windows 包不可用`
          #   **然后就照发不误** ⇒ Release 页面缺了整整一个平台
          #   （免安装 zip + NSIS 安装包一个都没有），而本次 workflow 里
          #     只有 Windows job 是红的、本 job 却是**绿的**。
          #   ⇒ 这正是本仓反复点名的「静默漏发」（对照 fb32a5c 那次修的是同一类病，
          #     那次修的是 artifact 路径结构，这次是平台 job 失败，同一个洞的不同入口）。
          #
          #   Windows / macOS 是 `if:` 无条件必跑的 job（只有 android 默认跳过）
          #   ⇒ 它们缺席**不是**正常情况，必须显式失败，绝不发一个缺平台的 Release。
          if [ "${{ needs.windows.result }}" != "success" ]; then
            echo "::error::Windows 是必跑 job 却以 ${{ needs.windows.result }} 结束 —— 拒绝发一个缺 Windows 产物的 Release"
            exit 1
          fi
          if [ "${{ needs.macos.result }}" != "success" ]; then
            echo "::error::macOS 是必跑 job 却以 ${{ needs.macos.result }} 结束 —— 拒绝发一个缺 macOS 产物的 Release"
            exit 1
          fi
          if [ -z "$FILES" ]; then
            echo "::error::三个平台都没有可用产物，拒绝发空 Release"; exit 1
          fi
          # ★★ 硬断言：rel/ 根下不许出现**子目录**。
          #   这是 run 37802958581 那次的静默漏发：Windows 的 artifact 里带了
          #   `build/` 与 `installer/` 两个子目录（因为上传的两个路径共同祖先
          #   是仓库根），于是 `[ -f "rel/sourin-windows-$TAG.zip" ]` 为假 ⇒
          #   那两条 `✗ Windows 包不可用` 只打了行日志，Release 照发不误 ——
          #   用户看到的是一个**少了 Windows 包**的版本，而 CI 全绿。
          #   ⇒ 有子目录就直接红，绝不静默少发。
          SUBS=$(find rel -mindepth 1 -type d | head -20)
          if [ -n "$SUBS" ]; then
            echo "::error::rel/ 下出现了子目录 —— artifact 的路径结构不对，会有包被静默漏发："
            echo "$SUBS"
            find rel -type f | head -40
            exit 1
          fi
          # ★ 再断言：Windows 那一份**必须**在（它是必跑 job）
          if [ "${{ needs.windows.result }}" = "success" ] && [ ! -f "$W" ]; then
            echo "::error::Windows job 成功但 $W 不在 —— 不接受「少发一个平台」"; exit 1
          fi
          if [ "${{ needs.windows.result }}" = "success" ] && [ ! -f "$SETUP" ]; then
            echo "::error::Windows job 成功但安装包 $SETUP 不在 —— 不接受只发免安装版"; exit 1
          fi
          # ★★ 对称断言 macOS（CodeRabbit 指出，已采纳）：macOS job 成功却
          #   没下到它的 zip/dmg ⇒ 直接红。理由与上面 Windows 那两条完全相同 ——
          #   否则只要 Windows 文件在、FILES 就非空，发布仍会继续，
          #   于是发出一个**少了 macOS 平台**的 Release（同一类「静默漏发」）。
          if [ "${{ needs.macos.result }}" = "success" ] && [ ! -f "$M" ]; then
            echo "::error::macOS job 成功但 $M 不在 —— 不接受「少发一个平台」"; exit 1
          fi
          if [ "${{ needs.macos.result }}" = "success" ] && [ ! -f "$D" ]; then
            echo "::error::macOS job 成功但 DMG $D 不在 —— 不接受只发 zip"; exit 1
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          # ★ 校验和清单（用户拿到包能自己核对完整性）
          #   ⚠️ 不能写 `sha256sum *.zip *.apk` —— android 被跳过时 `*.apk`
          #   不匹配任何文件，bash 会把**字面量** `*.apk` 传给 sha256sum 并报错。
          #   所以按**实际存在的文件**逐个算。
          ( cd rel && : > SHA256SUMS.txt
            for x in *.zip *.apk *.exe *.dmg; do
              [ -f "$x" ] && sha256sum "$x" >> SHA256SUMS.txt
            done ) || true
          echo "---- SHA256SUMS.txt ----"
          cat rel/SHA256SUMS.txt || true

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          # ★ release-notes.md 里的文件名用 `__VERSION__` 占位（tag 去掉前导 v），
          #   在这里替换掉 —— 这样同一份 notes 对任何版本都对，
          #   不会出现「发 v1.0.1 但说明里写着 1.0.0」这种事。
          VER="${TAG#v}"
          NOTES=/tmp/release-notes.md
          # ══════════════════════════════════════════════════════════════
          # ★★★ 生成「本版更新」（Owner 2026-10-19：「最近发的几个版本
          #     都没有更新说明，全都是默认的」）
          # ══════════════════════════════════════════════════════════════
          #
          # # 取证（不是猜）
          # ```text
          # · .github/release-notes.md 原先是**静态模板**，172 行里没有一节
          #   是"这一版改了什么"；线上 v1.3.0 的 body 实测 2974 字符，
          #   内容是**下载表格 + 安装说明 + 平台注意事项** ⇒ 没有任何版本差异信息。
          # · 模板 `## 关于本版本` 那段写的是「首个公开版本」——
          #   从 v1.0 到 v1.3 一直是同一句话。
          # ```
          #
          # # 做法：从 git 提交归纳（`tools/gen_release_notes.py`）
          # ```text
          # 上一个 tag 到本 tag 之间的提交 → 按前缀分类 → 剔除开发用语/残句
          # → 注入模板的 {{CHANGELOG}} 占位
          # ```
          #
          # ★ 脚本在「归纳结果为空」时**报错退出** ⇒ 这条 CI 会红 ⇒
          #   从结构上防止再发出一版没有说明的 release。
          #
          # ★★ 2026-10-19（批末复核查出并修）：原写法有两个致命问题
          # ```text
          # ① `git describe ... || true` 把失败吞成"首个 release"——
          #    而浅克隆/没 push tag/tag 拼错/指向根提交 全都表现为 describe 失败
          #    ⇒ 它们与"真的是首个 release"在代码里**无法区分**。
          # ② 于是 tag 在本地时会输出「本版无用户可见变更」并**照常发布**
          #    ⇒ Owner 报的缺陷原样复现，只是文案换了一句。
          # ```
          # ⇒ 修法（★ 复核抓出我第一版写错了，Lead 修）：
          #   要的是「**本 tag 在版本序里的紧邻前驱**」，而我第一版写的是
          #   `git tag --sort=-v:refname | grep -v "^$TAG$" | head -1`
          #   —— 那是「**最新的**其它 tag」，不是历史前驱。
          #
          #   实测（本地 4 个 tag）：
          #     TAG=v1.0.0 ⇒ PREV=v1.3.0   区间 [v1.3.0..v1.0.0] 反向
          #     TAG=v1.2.0 ⇒ PREV=v1.3.0   区间 [v1.3.0..v1.2.0] 反向
          #     TAG=v1.3.0 ⇒ PREV=v1.2.0   ← 只有最大 tag 才碰巧对
          #   ⇒ **重跑任何旧 tag 都会让生成器 exit 1**，
          #     而「修好 CI 后重跑同一 tag 补包」正是本文件 :1560 写明
          #     必须支持的场景 ⇒ 我把那条补救路径**堵死了**。
          #
          #   修法：`git describe --tags --abbrev=0 "$TAG^"`
          #   —— 它按**提交图**找最近的祖先 tag，天然满足：
          #     · 重跑旧 tag 时给出的仍是它真正的前驱
          #     · `v1.4.0-rc1` 不会把自己选成前驱（而 `sort -V` 会，
          #       因为预发布排在正式版之上 ⇒ rc 发布必红）
          #     · 真首个 tag 时失败 ⇒ 与「拿不到历史」可区分
          # ★★★ 2026-10-21（run 39546013679 实测）：`"${TAG}^"` 要求**本地已经有这个 tag**。
          #   而本 workflow 的设计是「填了 release_tag ⇒ 构建完**自动建** Release」
          #   （docs/RUNBOOK.md §1）—— 也就是说 publish job 跑的时候 tag **还不存在**，
          #   它是最后那步 `gh release create "$TAG"` 才创建的。
          #   ⇒ 全新 tag 必然 describe 失败，然后落进"首个 release"分支，
          #     而那条分支的 `--from "$TAG" --to "$TAG"` **同样要 tag 能被解析**：
          #       git log --no-merges --pretty=%s v1.4.0-rc3..v1.4.0-rc3
          #       fatal: ambiguous argument 'v1.4.0-rc3..v1.4.0-rc3': unknown revision
          #       ##[error]Process completed with exit code 2.
          #   ⇒ 引入「锚点」：
          #       tag 已经存在 ⇒ ANCHOR=$TAG，描述起点仍用 `$TAG^`（**语义一个字没变**）
          #       tag 还不存在 ⇒ ANCHOR=HEAD（它就是要打 tag 的那个提交），
          #                       describe 起点用 HEAD（HEAD 本身没 tag ⇒ 不会自己匹配自己）
          #   ⚠️ 两个起点不能统一写：用 `$TAG` 当 describe 起点会**返回 tag 自己**
          #      ⇒ 区间 `$TAG..$TAG` 为空 ⇒ 生成器 exit 1。原来写 `$TAG^` 正是为这个。
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            ANCHOR="$TAG"
            DESCRIBE_FROM="${TAG}^"
          else
            echo "::notice::本地还没有 tag $TAG（本次要新建它）⇒ 用 HEAD 当锚点"
            ANCHOR="HEAD"
            DESCRIBE_FROM="HEAD"
          fi
          PREV=$(git describe --tags --abbrev=0 "$DESCRIBE_FROM" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            # 没有任何更早的 tag ⇒ 真的是首个 release（允许留空）
            echo "::warning::历史里没有更早的 tag ⇒ 按首个 release 处理，更新说明留空"
            python3 tools/gen_release_notes.py --from "$ANCHOR" --to "$ANCHOR" \
              --allow-empty --out /tmp/notes-src.md
          else
            echo "本版更新：归纳 $PREV..$ANCHOR"
            python3 tools/gen_release_notes.py --from "$PREV" --to "$ANCHOR" \
              --out /tmp/notes-src.md
          fi
          sed "s/__VERSION__/$VER/g" /tmp/notes-src.md > "$NOTES"
          if grep -q "__VERSION__" "$NOTES"; then
            echo "::error::release-notes.md 里还有未替换的 __VERSION__"; exit 1
          fi
          # ★ 防回归：占位符没被替换掉 ⇒ 生成器没跑成 ⇒ 说明会是空的
          if grep -q "{{CHANGELOG}}" "$NOTES"; then
            echo "::error::本版更新没有被生成（{{CHANGELOG}} 仍留在模板里）"; exit 1
          fi
          # ══════════════════════════════════════════════════════════════
          # ★★★ 2026-10-19（批末复查）：**这才是 Owner 真正要的判据**
          # ══════════════════════════════════════════════════════════════
          #
          # # 上面两个守卫都拦不住"没有更新说明"
          # ```text
          # · `__VERSION__` 守卫：sed 全局替换 ⇒ 残留恒 0 ⇒ 永不触发
          # · `{{CHANGELOG}}` 守卫：生成成功则残留恒 0；生成失败则 bash -e 已中止
          #   ⇒ 也是**不可达**
          # ⇒ 而「### 本版无用户可见变更」能通过上面全部守卫**照常发布**
          #   —— 那正是 Owner 抱怨的形态换了个说法。
          # ```
          # ⇒ 加这条：**「本版更新」这一节里必须至少有一条 bullet**。
          #   首个 release 除外（它本来就该留空）。
          #
          # ★★★ 2026-10-19（复核发现我第一版写错了，Lead 修）：
          #   第一版是 `grep -qE '^\s*-\s+\S' "$NOTES"` —— 作用域是**整份文件**，
          #   而模板的「## 功能」小节**自带 30 条** `- **多源聚合**…`
          #   ⇒ 空说明 + 30 条模板 bullet ⇒ **G3 恒 PASS，永不触发**。
          #   实测：「本版更新」节内 bullet=0、全文件=30 ⇒ 判定 PASS。
          #
          # ⇒ 必须把作用域收进那一节：
          CHANGELOG_SECTION=$(sed -n '/^## 本版更新/,/^---$/p' "$NOTES")
          if [ -z "$PREV" ]; then
            echo "::notice::首个 release ⇒ 跳过「必须有内容」这条守卫"
          elif ! printf '%s\n' "$CHANGELOG_SECTION" | grep -qE '^\s*-\s+\S'; then
            echo "::error::「本版更新」这一节里**一条变更都没有** —— 这正是 Owner 报的缺陷。"
            echo "::error::检查：本区间的提交前缀是否都是「测试/文档/开发」这类内部改动？"
            echo "::error::修法：要么补一条面向用户的提交，要么显式调整前缀。"
            exit 1
          fi
          # ══════════════════════════════════════════════════════════════
          # ★★★ 预发布版本必须标记 --prerelease（Owner 第 19 条，2026-10-17）
          # ══════════════════════════════════════════════════════════════
          #
          # # 改前是什么样
          # ```text
          # 本文件里**没有任何** --prerelease 参数。
          # v1.4.0-rc1 在 GitHub 上显示为 Pre-release，是**手工补的标记**
          # ⇒ 每次发 rc 都得有人记得去点一下，漏了就变成「正式版」。
          # ```
          #
          # # 后果（不是形式问题）
          # ```text
          # · 不标 Pre-release ⇒ 用户会把它当稳定版下载
          # · 且 GitHub 的「Latest」语义会被 rc 抢走
          #   （Latest 应指向 v1.3.0 那种真稳定版，不是 rc）
          # ```
          #
          # # 规则
          # ```text
          # tag 里含 -rc / -beta / -alpha / -pre  ⇒ 预发布
          # 其余（v1.4.0 这种纯语义版本）          ⇒ 正式版
          # ```
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if [ -n "$PRERELEASE_FLAG" ]; then
            echo "· tag $TAG 判定为**预发布**（含 -rc/-beta/-alpha/-pre）"
          else
            echo "· tag $TAG 判定为**正式版**"
          fi
          echo "---- notes 前 12 行（已替换版本号）----"
          head -12 "$NOTES"
          # ★★ 幂等：Release 已存在 ⇒ **补传/覆盖**产物，而不是硬失败。
          #
          #   为什么必须幂等（run 38384556818 的真实事故，v1.1.0）：
          #   Windows job 因 choco 504 挂了 ⇒ 那次 Release 少了 Windows 两个包。
          #   修好 CI 之后**必须重跑同一个 tag** 才能补齐 —— 但重跑时
          #   `gh release create` 会报 `release already exists` 直接红，
          #   于是「重跑补包」这条路根本走不通，只能删了 Release 再来
          #   （删 Release = 期间下载页 404，用户可见的破坏性动作）。
          #   ⇒ 已存在就 `upload --clobber`（覆盖同名、补上缺的），
          #     并把 notes 也刷一遍（`gh release edit`）—— 全程用户看到的是
          #     「文件一个个补齐」，没有空窗期。
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "· Release $TAG 已存在 —— 走**补传/覆盖**路径（幂等重跑）"
            # ★★ 补包前**必须**核对：本次构建的提交 == 该 tag 指向的提交。
            #   （CodeRabbit 指出，已采纳）否则从已经前进的 main 上重跑一个
            #   **旧 tag** 时，会用**新提交**构建出的产物去覆盖旧 Release 的资产，
            #   而版本号标签仍是旧的 —— 用户下到的包与它标称的版本对不上，
            #   且 `--target` 只作用于 create、对已存在的 Release 不生效。
            #   ⇒ 提交不匹配就硬失败，让人明确用**该 tag 对应的 ref** 重跑。
            TAG_SHA=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq '.sha')
            echo "tag $TAG 指向 $TAG_SHA / 本次构建 ${{ github.sha }}"
            if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
              echo "::error::拒绝补包：tag $TAG 指向 $TAG_SHA，而本次构建的提交是 ${{ github.sha }} —— 会用错版本的产物覆盖 Release 资产。请用该 tag 对应的 ref 重跑。"
              exit 1
            fi
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "源影 $TAG" \
              --notes-file "$NOTES" \
              $PRERELEASE_FLAG
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              ${{ steps.chk.outputs.files }} \
              rel/SHA256SUMS.txt
            echo "✓ Release 已更新（产物补齐 / 覆盖）"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "源影 $TAG" \
              --notes-file "$NOTES" \
              --target "${{ github.sha }}" \
              $PRERELEASE_FLAG \
              ${{ steps.chk.outputs.files }} \
              rel/SHA256SUMS.txt
            echo "✓ Release 已创建"
          fi
          gh release view "$TAG" --repo "${{ github.repository }}"
          # ★★ 发布后**逐个核对**资产真的挂上去了，且字节数非零
          #   （CodeRabbit 指出，已采纳）：`gh release upload --clobber`
          #   （以及 create）**不是原子操作** —— 中途失败可能留下
          #   「少了一个包」或「包存在但为 0 字节」的状态，而命令本身退出 0。
          #   ⇒ 从**服务端**读回真实资产清单来核对，绝不凭命令成功就信。
          echo "---- 核对 Release 资产（从服务端读回）----"
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          EXPECTED="sourin-windows-$TAG.zip Sourin-Setup-${TAG#v}.exe sourin-macos-$TAG.zip sourin-macos-$TAG.dmg SHA256SUMS.txt"
          MISSING=""
          for f in $EXPECTED; do
            # 取该资产的字节数；不存在 ⇒ 空串
            sz=$(gh release view "$TAG" --repo "${{ github.repository }}" \
                   --json assets --jq ".assets[] | select(.name==\"$f\") | .size")
            if [ -z "$sz" ]; then
              MISSING="$MISSING $f(不存在)"; echo "✗ $f 不在 Release 上"
            elif [ "$sz" -le 0 ]; then
              MISSING="$MISSING $f(0 字节)"; echo "✗ $f 是 0 字节"
            else
              echo "✓ $f = $sz 字节"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Release $TAG 的资产不完整/损坏：$MISSING"
            exit 1
          fi
          echo "✓ 全部必备资产都在 Release 上且字节数非零"
          # ══════════════════════════════════════════════════════════════
          # ★★★ 核对预发布标记**真的生效了**（从服务端读回）
          # ══════════════════════════════════════════════════════════════
          #
          # 为什么不能只信「我传了 --prerelease 参数」：
          # ```text
          # · gh 对未知参数会忽略而非报错（历史上踩过类似坑）
          # · Release 已存在走 edit 分支时，参数写错位置也不会有提示
          # ⇒ 唯一可信的判据是**服务端返回的 isPrerelease 字段**。
          # ```
          ACTUAL_PRE=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json isPrerelease --jq '.isPrerelease')
          echo "服务端 isPrerelease = $ACTUAL_PRE"
          if [ -n "$PRERELEASE_FLAG" ]; then
            if [ "$ACTUAL_PRE" != "true" ]; then
              echo "::error::tag $TAG 应为预发布，但服务端 isPrerelease=$ACTUAL_PRE —— 标记没生效"
              exit 1
            fi
            echo "✓ 已正确标记为 Pre-release"
          else
            if [ "$ACTUAL_PRE" = "true" ]; then
              echo "::error::tag $TAG 应为正式版，但服务端 isPrerelease=true —— 被误标成预发布"
              exit 1
            fi
            echo "✓ 已正确标记为正式版"
          fi
