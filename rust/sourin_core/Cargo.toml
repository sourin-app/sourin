[package]
name = "sourin_core"
version = "0.1.0"
edition = "2021"

# ═══════════════════════════════════════════════════════════════════════
#  源影核心 —— 与 UI 框架无关的纯 Rust 业务逻辑
# ═══════════════════════════════════════════════════════════════════════
#
# # 这个 crate 是什么
#
# 从早期原型工程（`src-tauri`）里**原样抽出**的业务核心，
# 目标是验证它能否脱离 Tauri 独立编译 —— 这是「复用 81% 代码」
# 这条硬指标的前提。
#
# # 实测依据（2026-09-22）
#
# 抽之前先量过耦合度：
# ```text
# provider.rs         381 行   0 处 Tauri 引用  ✓
# registry.rs         961 行   0 处             ✓
# model.rs            857 行   0 处             ✓
# store.rs           1563 行   0 处             ✓
# proxy.rs            539 行   0 处             ✓
# streamproxy.rs     1595 行   1 处             ⚠
# follow.rs           364 行   0 处             ✓
# backup.rs           505 行   0 处             ✓
# providers/         4195 行   0 处             ✓
# sync/              1475 行   0 处             ✓
# remote/            1195 行   0 处             ✓
# plugins/           3281 行   0 处             ✓
# ─────────────────────────────────────────
# 合计              16911 行   仅 1 处
# ```
# 那唯一一处是 `streamproxy.rs:386` 的
# `tauri::async_runtime::spawn`，等价于 `tokio::spawn`。
#
# # 依赖为什么这么少
#
# 抽完统计出的外部依赖只有：
# ```text
# serde / serde_json   序列化
# tokio                异步运行时
# reqwest              HTTP
# axum + tower-http    HTTP 服务（流代理 / 局域网遥控）
# rusqlite (bundled)   SQLite（自带，无需系统依赖）
# rquickjs             插件引擎（纯 Rust 的 QuickJS）
# zip / futures-core / bytes / async-trait
# ```
# **全是跨平台 crate** —— 这也是它能在 Android 上编译的原因。
#
# # 对 Flutter 意味着什么
#
# Flutter 用 **Dart FFI** 调这个 crate 编出的 cdylib：
# ```text
# Flutter (Dart)
#      ↓ dart:ffi
# sourin_core.dll / libsourin_core.so
#      ↓
# 原有的 providers / plugins / store / streamproxy ...
# ```
# UI 层完全重写，业务层一行不改。

[lib]
# ★ cdylib 给 Flutter 用；rlib 保留以便跑单测
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "process", "io-util"] }
futures-core = "0.3"
bytes = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "socks", "stream"], default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# ★ 2026-10-18（E2E 验证发现）：raw-deflate 回退需要手动解压。
#   已在依赖树里（reqwest 的 deflate 特性间接引入 flate2 1.1.10），
#   这里只是提成直接依赖，**不新增编译单元**。
flate2 = "1"

# ★ csp_Bili 的 WBI 搜索（2026-10-26）：该源的搜索要求 `w_rid = md5(参数排序串 + mixin_key)`。
#   **为什么不能用 ring**：ring 只提供 SHA-1/256/384/512 系列，**没有 MD5**
#   （WBI 的 `w_rid` 就是 MD5）；`md-5` 是 RustCrypto 的纯 Rust 实现，
#   无 C 依赖、不引入运行时（`digest` 是它的底座，同版本）。
md-5 = "0.10"

# ★ 第19项 csp_App99（2026-10-26）：响应/请求体是 AES-128/256-CBC + PKCS5。
#   **为什么不能用 ring**：ring 只提供 AES-**GCM**，没有 CBC 模式（本项目的凭据加密用 GCM 是对的，
#   但这里必须与站点协议一致）；`aes` + `cbc` 是 RustCrypto 的纯 Rust 实现，
#   无 C 依赖、不引入任何运行时，编译产物很小。
#   `cipher` 是这两个 crate 的共同底座（由 `cbc` 传递引入，不另外指定版本）。
#   已用于 App99（浏览链路对真实站点实证：home 8 分类 / list 20 条；
#   userInfo 被拒只影响登录态）。
aes = "0.8"
cbc = "0.1"

# ★ R3-B csp_AppDrama（2026-10-27）：拿 ext 的 `publicKey` 做 `RSA/ECB/PKCS1Padding` 加密，
#   解开 `dataKey`（那把 AES 钥匙）。
#
# # 为什么**没有替代路径**（不是"顺手引个大库"）
# ```text
# ① 它是**钥匙**，不是"其中一段"：没有它就拿不到 dataKey ⇒ 后面的 AES + JSON 段**全走不动**。
# ② ring **顶替不了**：ring 0.17 的 RSA 只有 **OAEP 加密** + **PKCS1 签名**，
#    **不支持 PKCS1v1.5 加密**（查过 ring/src/rsa/encryption.rs 与 padding/，无该路径）。
#    而上游协议要的逐字就是 `RSA/ECB/PKCS1Padding`。
# ③ 与既有纪律不冲突：本仓纪律是"**不新增运行时**"（不是"不新增依赖"）。
#    `rsa` 与 `aes`/`cbc` **同性质**（RustCrypto 纯 Rust、无 C 依赖、无新执行体）。
# ④ **先例一致**：`aes`/`cbc` 就是 App99 那次为"站点协议要求"加的，同一条理由。
# ```
# 依赖链（rsa → num-bigint-dig / pkcs1 / pkcs8 / spki）**已在本地 cargo 缓存里**
# ⇒ 可 `--offline` 构建，不需要联网。
rsa = "0.9"

log = "0.4"

# ★ csp 类注册插件化（R3-D，2026-10-27）：**编译/链接期**自注册
#
# Owner 原话：「要插件化开发,不要耦合太严重,未来还可能兼容其他平台」
#
# # 它替代了什么（改前）
# ```text
# `csp/mod.rs` 的 `build_registry()` 里**逐行 m.insert(...) 写死** 每个类：
#   新增一个类 = 改核心文件 + 加一行 ⇒ 69 个待补类 = 69 行写死（Owner 说的"耦合太严重"）
#   且键是 `&'static str` + 值是 `fn()` 函数指针的**静态表** ⇒ 外部/其他平台无法注册。
# ⇒ 改后：类在**自己的文件**里 `inventory::submit!{…}` 自注册，核心只遍历一遍。
# ```
#
# # ★ 为什么它不算违反本仓「不新增运行时」纪律（诚实契约第 4 条）
# ```text
# 那条纪律约束的是**运行期引擎**（会带进新的执行体 / 攻击面 / 体积，如 HTML 选择器库）。
# `inventory` 做的事在**编译/链接期**：往产物里留一个链接器构造器
#   （`.text.startup`(ELF) / `.CRT$XCU`(PE)）+ 一张静态链表；
#   运行期只有"遍历这张本来就在 binary 里的链表" ⇒ **无解释器、无新线程、无新执行模型**。
# 成本实测：`cargo tree -p inventory` ⇒ 只它自己一层；非 wasm **零传递依赖**、
#   无 build.rs、无 proc-macro、不需要 nightly（stable 可用）。
# ⇒ 与本仓既有先例（`flate2`/`ring` 提成直接依赖的理由是"不新增编译单元"；
#   `md-5`/`aes`/`cbc` 是"纯 Rust、无 C 依赖、不引入任何运行时"）**同一档**。
# ```
#
# ⚠️ **平台实测边界（照实写，不许在落地时变成"已支持 Android"）**
# ```text
# ✅ 已实测：Windows/MSVC —— 含本仓同款 `[profile.release]`（lto+strip）下，
#    编成 cdylib 后被 **Dart FFI 真加载**，注册项完整存活（读数 3/3）。
#    留档：`.probe/r3-linkreg-dll-load.log`（+ `.probe/r3-registry-decoupling-verdict.md` §1 表 c）。
# ❓ **未实测：Android** —— 本机**缺 NDK 配置**（`clang.exe not found`），
#    且**本仓自己交叉编也报同一个错**（对照：`cargo check --target armv7-linux-androideabi`）
#    ⇒ 是**环境**限制，不是 inventory 的问题。
#    源码依据：`inventory` 的 `link_section` 分支含 `target_os = "android"`（`.text.startup`），
#    README 明写支持 "Android"。**但这只是"上游声明支持"，不是"我们验过"。**
# ⇒ 本仓当前对 Android **未验**；将来真编 Android 时必须补验这一步。
# ```
inventory = "0.3"

# ★ 凭据加密（2026-10-18，CS-1）
#
# 用于「登录态随云同步」的加密：PBKDF2 派生密钥 + AES-256-GCM。
#
# ⚠️ **不是新依赖** —— `ring` 早已在依赖树里（`reqwest → rustls → ring`），
#    这里只是把它从**传递依赖**提成**直接依赖**，不新增下载、不新增编译单元。
#    与上面 `flate2` 完全同一种情况。
#
# # 为什么用 ring 而不是 chacha20poly1305 + argon2
# ```text
# · ring 已在树里 ⇒ 零新增供应链风险、零新增编译时间
# · ring 自带 aead（AES-256-GCM / ChaCha20-Poly1305）与 pbkdf2（HMAC-SHA256）
# · 代价：ring **没有 argon2**，只能用 PBKDF2
#   ⇒ 用足够高的迭代次数补偿（见 sync/credentials.rs 的 ITERATIONS 与理由）
# ```
ring = "0.17"

# ── 下面这些是实测编译时补出来的（第一轮 177 个 error 全是缺 crate）──
anyhow = "1"
thiserror = "2"
urlencoding = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

# 局域网遥控要生成二维码（手机扫码直连，不用手输内网 IP）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# ★ 凭据安全：系统钥匙串
#
# ⚠️ 这是**唯一一个需要平台适配**的依赖：
# ```text
# Windows → windows-native（Credential Manager）
# macOS   → apple-native（Keychain）
# Android → 没有 android-native feature，
#           要换成别的实现（见下面 cfg 段）
# ```
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# ★ JS 插件引擎
#
# # 三个 feature 各有原因（原工程的注释记录得很清楚）
#
# ```text
# bindgen  → rquickjs 不提供 Android 预生成绑定，
#            不开会报 bindings/aarch64-linux-android.rs 找不到
# parallel → 本项目的 MediaProvider trait 是 Send + Sync，
#            而 rquickjs 默认的 AsyncContext 不是 Send；
#            不开会得到一屏「future cannot be sent between threads safely」
# macro    → 提供 async_with!，等 JS Promise 必须用它
#            （ctx.with() 不能返回 future —— 源码注释写明，原工程实测踩过）
# ```
# ★ 版本从 0.9 升到 0.14（2026-09-22）—— 为了支持 32 位 ARM
#
# # 0.9.0 的 32 位 bug（实测确认）
#
# `rquickjs-sys-0.9.0/src/lib.rs` 里这样选实现：
# ```rust
# #[cfg(target_pointer_width = "64")]
# include!("inlines/ptr_64.rs");           // 用 JSValueUnion（非 nan-boxing 布局）
#
# #[cfg(target_pointer_width = "32")]
# include!("inlines/ptr_32_nan_boxing.rs"); // 用 JS_MKVAL（nan-boxing 布局）
# ```
# 但 armv7（`target_pointer_width = "32"`）上 bindgen 生成的是 **nan-boxing**
# 绑定（`pub type JSValue = u64`，没有 `JSValueUnion`），
# 而编译却走了 `ptr_64.rs` → 一屏 `cannot find JSValueUnion` / `u64 has no fields`。
#
# ⚠️ 重要背景：**原工程其实也没编过 32 位** ——
#    它 target 里那个 armv7 的 .so 是 09/18 的，早于插件引擎接入，
#    实测里面**没有任何 rquickjs 符号**。所以这不是重写引入的回归。
#
# # 为什么必须支持 32 位（与硬指标② 有关）
#
# ```text
# 很多 Android TV 盒子是 32 位 ARM（armeabi-v7a）
# ```
# 而 media_kit 的 libmpv 是**带 v7a 的** —— 如果我们的核心没有，
# 用户装到 32 位盒子上会：应用能启动 → 一调核心就 DynamicLibrary.open 失败
# → 看到「核心启动失败」而不是明确的不支持。
#
# # 验证方式
#
# 建了个临时 crate 单独编 armv7，**0.14 通过、0.9 失败** ——
# 确认是上游修复，不是我们绕过去的。
rquickjs = { version = "0.14", default-features = false, features = ["bindgen", "futures", "macro", "parallel"] }

[dev-dependencies]
# 原工程的 axum 测试用 `tower::ServiceExt::oneshot` 直接给 Router 发请求
# （不用真起 HTTP 服务器，测试快且不占端口）。
# 抽核心时漏了这个 —— `cargo test` 才暴露出来（`cargo check` 不编译 test 段）。
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"

# ═══════════════════════════════════════════════════════════════════════
#  Release 优化 —— 与硬指标③（安装包 <50MB）直接相关
# ═══════════════════════════════════════════════════════════════════════
#
# # 为什么必须显式写这一段（2026-09-22 踩到）
#
# 抽核心时我漏了原工程的 `[profile.release]`，结果：
# ```text
# sourin_core.dll  8.12 MB   ← 默认设置（含调试符号、无 LTO）
# ```
# 而原工程同样代码编出来是 **2.5 MB**。差了 3 倍多，
# 而这一切只是少了一段配置 —— **不报错，只是产物变大**。
#
# 发现方式：交叉编译 Android 时注意到 .so 有 10.6MB，
# 回头看 Windows DLL 才发现也涨了。
#
# # 每一项的作用与代价
#
# | 设置 | 作用 | 代价 |
# |---|---|---|
# | `strip = true` | 去掉调试符号（**体积大头**） | 崩溃栈没有行号 |
# | `lto = true` | 跨 crate 内联与死代码消除 | 编译慢很多 |
# | `codegen-units = 1` | 让 LTO 看到全部代码 | 编译更慢 |
# | `opt-level = "s"` | 优化体积而非速度 | 略慢一点 |
#
# # ⚠️ `panic = "abort"` 与我的 FFI 设计冲突 —— 所以**故意不开**
#
# 原工程用 `panic = "abort"` 是对的（它是完整应用，崩了就是崩了）。
# 但我这里不能用，因为：
#
# ```text
# ffi.rs 的 dispatch_blocking 用 catch_unwind 兜 panic，
# 把 panic 转成 JSON 错误返回给 Flutter。
# ```
# 而 `panic = "abort"` **让 catch_unwind 失效** —— panic 直接 abort 进程，
# 没有 unwind 可捕获 → 插件里的一个小 panic 会**直接崩掉整个 Flutter 应用**，
# 而且用户看不到任何错误信息。
#
# 用一点体积换「宿主不会被插件 panic 带走」，这个取舍值得 ——
# 何况 strip + LTO 已经能把它压回 2-3MB。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# panic = "abort"   ← 故意注释掉，原因见上
