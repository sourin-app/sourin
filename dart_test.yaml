# ═══════════════════════════════════════════════════════════════════════
#  dart_test.yaml —— 测试标签配置
# ═══════════════════════════════════════════════════════════════════════
#
# ★★★ 为什么有 `native-media` 这个标签（2026-09-25，task-31 实测）
#
# # 现象
# `flutter test test/` 默认并发跑，**时绿时红**（6 次跑出 6 种结果）。
# 失败形态是"整文件用例一起 `did not complete`"（不是单用例失败）。
#
# # 根因（已用干净交错 A/B 证明，完整证据见 `.probe/native-media-tests.md`）
# ```text
# MediaKit.ensureInitialized() 加载 libmpv-2.dll 时，
# **flutter_tester.exe 进程 native 崩溃**（访问违例 c0000005）
#
# 证据链：
#   ① 失败时 flutter test 退出码 = 79（不是 1）—— 进程异常终止
#   ② Windows 事件日志：APPCRASH / flutter_tester.exe / P6=c0000005
#   ③ WER LoadedModule（42 个）里唯一的非系统库 = libmpv-2.dll
#   ④ 干净交错 A/B：不加载 libmpv 崩 0/25；加载则崩 6/25
#   ⑤ 只加 MediaKit（不挂 PlayerPage、不碰 RemoteBridge）崩 3/15
#      ⇒ 与用例内容无关
#   ⑥ 读 flutter_tools 源码解释了"为什么没有错误信息"：
#      flutter_tester_device.dart 的 finished getter 在 Windows 上直接 return
#      ⇒ 崩溃信息被主动丢弃 ⇒ 上层只看到 `did not complete`
# ```
#
# # ★★ 为什么用 `skip:` 而不是 `exclude_tags:`（实测三选一）
# ```text
# A. tags: {native-media: {skip: "..."}} + `--run-skipped`
#      默认               → `All tests skipped.`     exit=0  ✓
#      显式 --run-skipped → `+5 All tests passed!`   exit=0  ✓
#   ⇒ ★ 两条路径都对，采用
#
# B. exclude_tags: native-media + `--tags native-media`
#      默认         → `No tests match...`  exit=79  ✗
#      显式 --tags   → `No tests match...`  exit=79  ✗
#   ⇒ 排除发生在选择之前 ⇒ 排除了就**无法**用 --tags 放行
#
# C. exclude_tags: 'native-media && !run-native' + `--tags run-native`
#      三条路径全部 `No tests match` + exit=79  ✗
#   ⇒ 该文件只带 native-media、不带 run-native ⇒ 选择器永远为假
# ```
#
# # 用法
# ```powershell
# # 默认：不跑 native-media（CI 稳定全绿）
# flutter test test/
#
# # ★ 显式跑（改播放器 / media_kit 相关代码时**应该**跑）
# flutter test test/ --run-skipped --tags native-media --concurrency=1
# ```
#
# ═══════════════════════════════════════════════════════════════════════
#  ★★ 2026-10-17（PR #30 取证时踩到）：「skip ≠ pass」会制造假回归信号
# ═══════════════════════════════════════════════════════════════════════
#
# 现场：为了判断"某条红是不是本轮引入"，我在 `git worktree` 里建了**基线副本**，
# 跑全量得到 `+3250 ~92 全绿` —— 看起来是"基线干净、当前有回归"。
#
# 但真相是：
# ```text
# 基线工作树里**没有** build/windows/x64/libmpv/libmpv-2.dll（构建产物，不入库）
#   ⇒ 所有依赖 libmpv 的文件整文件 **skip**
#   ⇒ 而当前工作区刚 `flutter build windows` 过，夹具在 ⇒ 那些文件**真跑**
#   ⇒ 真跑才暴露它们自身的 flaky（本文件上方记载的 native 崩溃）
# ```
#
# ⇒ 教训：**用"基线全绿 vs 当前红"判定回归之前，必须先确认那条用例
#   在两边都真的跑了。** `~N` 里的 N 就是"没跑"，它既不算通过也不算失败。
#
# 具体症状（本次实测）：全量跑时每次咬到的文件**都不同**
# （`t61_panel_radius` / `t72_stream_sheet` / `zz_media_r1_local_open_probe` /
#  `zz_t12_defect_a_probe`），且它们**单独跑全部 exit=0**、**全都碰 media_kit**。
# 这就是本文件记载的那个 native 崩溃，不是被测代码的缺陷。
#
# # 只看被排除的清单
# flutter test test/ --run-skipped --tags native-media --reporter=expanded
# ```
#
# ⚠️ `--concurrency=1` **不能**避免崩溃（实测：串行 8 次里红 5 次；
#    单文件串行也红 1/5）。它只是让输出更易读。
#
# ⚠️ 崩溃**仍然存在** —— 本配置只是不让它污染默认测试。
#    根因在第三方 libmpv-2.dll，我们改不了它的源码。
tags:
  # ★ 依赖真实 media_kit（libmpv 原生库）的测试
  #
  # 这些文件调用 `MediaKit.ensureInitialized()`，会在 flutter_tester 里
  # 偶发 native 崩溃。默认跳过，需要时用
  # `--run-skipped --tags native-media` 跑。
  native-media:
    skip: "默认跳过：加载 libmpv 会让 flutter_tester 偶发 native 崩溃（见 dart_test.yaml 顶部）。手动跑：flutter test test/ --run-skipped --tags native-media --concurrency=1"
  # ★ 依赖**隔离的 USERPROFILE** 才能跑的测试
  #
  # DownloadDir 的默认兜底根目录 = $USERPROFILE\Videos\源影。
  # Platform.environment 在 flutter_test 里只读 ⇒ 隔离只能由**进程环境**提供
  # （见该文件头）。CI 跑的是裸 `flutter test`，没有这个变量，
  # 前提自检会红并把整个 job 带下去 ⇒ 默认跳过。
  # 手动跑见该文件头。
  needs-isolated-userprofile:
    skip: "默认跳过：需要以隔离的 USERPROFILE 运行，否则会在用户真实 Videos\\源影 里建目录。手动跑见该测试文件头"

  # ★ 依赖 SOURIN_SHOT_DIR 才能跑的**截图自查工具**
  #
  # 这些文件渲染真页面并把 PNG 落盘，像素好不好看靠人读图。
  # 缺省目录是系统临时目录/sourin-shots —— 断言本该拦住的"写到仓库里"
  # 已经发生了，所以默认跳过，让 agent 显式指定输出目录。
  needs-shot-dir:
    skip: "默认跳过：截图自查工具，需要 SOURIN_SHOT_DIR 指定输出目录。手动跑见该测试文件头"
